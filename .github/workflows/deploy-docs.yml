name: 📖 部署介绍站到 GitHub Pages

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  介绍站（docs-site/，VitePress）自动部署                                ║
# ╠════════════════════════════════════════════════════════════════════════╣
# ║  线上地址 https://legacy.magireco.top —— Pages 绑定自定义域名，         ║
# ║  域名由 docs-site/public/CNAME 声明。                                   ║
# ║                                                                        ║
# ║  首次启用前需在 Settings → Pages 把 Source 设为 "GitHub Actions"，      ║
# ║  并在 Custom domain 填 legacy.magireco.top（DNS 指向 GitHub Pages）。   ║
# ║  只动 docs-site/ 以外路径的 push 不会触发部署。                         ║
# ╚════════════════════════════════════════════════════════════════════════╝

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署；不取消进行中的生产部署
concurrency:
  group: pages-legacy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lastUpdated 需要完整历史才能取到每页的最后提交时间

      # 与 build-apk 的预检同一个道理：缺 secret 要在**动手之前**报，而不是让
      # 装依赖、构建都跑完再说。这一步排在 setup-node 之前，缺了几秒钟就红。
      #
      # 而且这个缺法本身没有报错：注入不上就发布一个「下载按钮点不开」的站点，
      # 构建、部署全绿，只有玩家点了才知道。所以它必须是硬失败。
      - name: 🔑 预检必需的 secret
        env:
          DOWNLOAD_URLS: ${{ secrets.DOWNLOAD_URLS }}
        run: |
          set -euo pipefail
          if [ -z "${DOWNLOAD_URLS:-}" ]; then
            echo "::error::secret DOWNLOAD_URLS 未配置或为空（Settings → Secrets and variables → Actions）"
            echo "::error::格式：逗号分隔的完整地址，第一条即页面上「推荐」的那条"
            exit 1
          fi
          echo "必需的 secret 都在（DOWNLOAD_URLS）"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 🔑 注入下载地址
        working-directory: .
        env:
          DOWNLOAD_URLS: ${{ secrets.DOWNLOAD_URLS }}
        run: python3 tools/inject-download-url.py

      - name: 构建
        run: npm run docs:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
