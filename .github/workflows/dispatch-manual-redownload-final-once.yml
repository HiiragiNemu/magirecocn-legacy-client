name: one-shot-dispatch-manual-redownload-final

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-manual-redownload-final-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for cleanup commit and dispatch official APK
        env:
          : ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 30
          gh workflow run build-apk.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f verify_only=false
