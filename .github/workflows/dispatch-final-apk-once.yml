name: one-shot-dispatch-manual-redownload-apk

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-final-apk-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for dispatcher cleanup, then publish official APK
        env:
          : ${{ github.token }}
        run: |
          set -euo pipefail
          # 本运行一旦启动，外部 GitHub 接口会删除本临时文件；稍候再以干净 main
          # 显式触发正式 build-apk.yml，使发布源码树不携带一次性调度器。
          sleep 30
          gh workflow run build-apk.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f verify_only=false
