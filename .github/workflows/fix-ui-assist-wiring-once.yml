name: one-shot-ui-assist-wiring

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ui-assist-wiring-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire UI assist to overlay lifecycle and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('patch/src/main/java/io/kamihama/magianative/CNCNDownloadUI.java')
          s = p.read_text(encoding='utf-8')

          reps = [
            (
'''                if (existing != null) {
                    overlayView = existing;
                    decorView   = dv;
                    isShowing   = true;
                    CNLog.w("界面", "认领已在视图树上的浮层，跳过重建");
                    return;
                }''',
'''                if (existing != null) {
                    overlayView = existing;
                    decorView   = dv;
                    isShowing   = true;
                    CNDownloadUiAssist.ensureInstalled();
                    CNLog.w("界面", "认领已在视图树上的浮层，跳过重建");
                    return;
                }'''
            ),
            (
'''                    decorView = dv;
                    CNLog.w("界面", "浮层曾脱离视图树，已重新挂上");
                    return;''',
'''                    decorView = dv;
                    CNDownloadUiAssist.ensureInstalled();
                    CNLog.w("界面", "浮层曾脱离视图树，已重新挂上");
                    return;'''
            ),
            (
'''                decorView   = dv;
                overlayView = fresh;
                isShowing   = true;
                renderAll();''',
'''                decorView   = dv;
                overlayView = fresh;
                isShowing   = true;
                CNDownloadUiAssist.ensureInstalled();
                renderAll();'''
            ),
            (
'''            overlayView = fresh;
            // 立即把当前进度重新渲染到新视图上
            renderAll();''',
'''            overlayView = fresh;
            CNDownloadUiAssist.ensureInstalled();
            // 立即把当前进度重新渲染到新视图上
            renderAll();'''
            ),
            (
'''                CNCNDownloadUI.overlayView = root;
                CNCNDownloadUI.isShowing = true;''',
'''                CNCNDownloadUI.overlayView = root;
                CNCNDownloadUI.isShowing = true;
                CNDownloadUiAssist.ensureInstalled();'''
            ),
          ]

          for i, (old, new) in enumerate(reps, 1):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'replacement {i}: expected 1 occurrence, got {n}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git rm .github/workflows/fix-ui-assist-wiring-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch/src/main/java/io/kamihama/magianative/CNCNDownloadUI.java
          git commit -m "fix(ui): 字体与位置控制随下载浮层立即挂载" \
                     -m "此前 CNDownloadUiAssist 只由实际下载函数触发；资源已装或本轮仅热更检查时不会进入 CNChunkedDownload.download，因此界面没有‘字 / ↔’入口。现把安装调用接到浮层创建、认领、重挂和主题重建生命周期，进入下载浮层即始终可用。" \
                     -m "Co-authored-by: Codex <noreply@openai.com>"
          git push origin HEAD:main
