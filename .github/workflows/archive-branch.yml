name: 🗄️ 归档分支为 tag

# ╔════════════════════════════════════════════════════════════════════╗
# ║   分支退役的唯一正确姿势（协作方案 §一，见 CONTRIBUTING.md）          ║
# ╠════════════════════════════════════════════════════════════════════╣
# ║   旧分支**不要直接删**：先在其尖端打 `archive/<原分支名>` tag，        ║
# ║   确认 tag 已推上远端，然后才删分支。这条流水线把这三步做成一个       ║
# ║   动作，避免「删了才发现没存档」。                                   ║
# ║                                                                    ║
# ║   安全约束：                                                       ║
# ║   ▸ main 拒绝归档；                                                ║
# ║   ▸ archive tag 已存在且指向**别的**提交 → 直接失败，不覆盖          ║
# ║     （archive/* tag 不可变；远端 ruleset「refs/tags/*」启用后        ║
# ║       还会从服务端再挡一层：禁删、禁强推）；                          ║
# ║   ▸ tag 推上去并验证指向之后才删分支，顺序不能反。                   ║
# ╚════════════════════════════════════════════════════════════════════╝

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要归档的分支名（打 archive/ tag 后删除该分支）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 检出（全量历史 + tags）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 用维护者 PAT 而不是默认 ：打 archive tag / 删分支
          # 会被 ruleset（活跃分支保护 / refs/tags/*）拦下——
          # 的 github-actions[bot] 身份不能绕过 ruleset，PAT 在 bypass 列表。
          token: ${{ secrets. }}

      - name: 🗄️ 打 tag → 验证 → 删分支
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          # 输入清洗：去掉可能带的 refs/heads/ 前缀与首尾空白
          BRANCH="${BRANCH#refs/heads/}"
          BRANCH="$(echo "$BRANCH" | xargs)"
          case "$BRANCH" in
            main|"") echo "::error::main 不能归档，分支名也不能为空"; exit 1 ;;
          esac

          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null \
            || { echo "::error::分支 origin/$BRANCH 不存在"; exit 1; }
          TIP=$(git rev-parse "origin/$BRANCH")
          # F-020：每次运行用新且不可复用的 immutable tag。旧逻辑复用
          # archive/$BRANCH 固定 tag，且校验条件是「远端≠TIP 且 本地≠TIP」——
          # 远端 tag 在 fetch 后被移动/删除时，本地 tag 兜底仍放行删分支。
          # 现在 tag 创建与分支删除在同一个 server-side atomic push 里完成，
          # 任何一步失败（含分支被推进导致 lease 失败）都不删除分支。
          TAG="archive/$BRANCH-${TIP:0:12}-${GITHUB_RUN_ID}"
          echo "分支尖端: $TIP"
          echo "归档 tag: $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$TIP"
          git push --atomic \
            --force-with-lease="refs/heads/$BRANCH:$TIP" \
            origin \
            "refs/tags/$TAG:refs/tags/$TAG" \
            ":refs/heads/$BRANCH"

          {
            echo "## 🗄️ 分支已归档"
            echo
            echo "- 分支：\`$BRANCH\`（已删除）"
            echo "- 存档 tag：\`$TAG\` → \`${TIP:0:12}\`"
            echo
            echo "恢复方式：\`git push origin $TIP:refs/heads/$BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"
