name: 🔧 构建 libaria2c.so（双 TLS 后端）

# 重建 libaria2c_{ossl,gnutls}.so（aria2 1.37.0 进程内库，双 ABI × 双后端）。
# 原构建是 2026-08-17 在维护机手工做的（脚本归档 aria2c-so.zip 已随机器佚失），
# 本 workflow 按 THIRD-PARTY-NOTICES.md 的配方记录完整重建：版本全部钉死、
# tarball 全部 sha256 硬校验（X-C3 纪律：源码与可执行构件同等级），
# 构建后自检不过即失败（见 tools/build-aria2.sh verify_so）。
#
# 默认只产出 .so artifact 不入库（重建产物哈希必变：NDK 漂移、路径嵌入等）。
# 勾选「refresh_repo」时，构建+自检+与基线对拍全过后，直接把 4 枚 .so 替换进
# 仓库 lib/ 并刷新 THIRD-PARTY-NOTICES.md 的 sha256 pin，提交推 main。
# ⚠ refresh_repo 会改动仓库二进制：重建产物功能面与基线一致（对拍把关），
# 但哈希必变，真机验证通过后再勾选。
on:
  workflow_dispatch:
    inputs:
      refresh_repo:
        description: '构建后直接替换仓库 lib/ 下的 .so 并刷新 sha256 pin 提交推 main（真机验证后再用）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 📦 检出仓库
        uses: actions/checkout@v7

      - name: 📥 下载并钉死 NDK r25c（与 main 主机验证配方完全一致）
        # runner 自带 NDK 已漂到 r26+：verify_so 的 armv7 校验读 r25c 专属
        # stub 路径（sysroot/usr/lib/arm-linux-androideabi/21），版本不对会在
        # 最后一刻误报；且哈希必变。android/ndk action 的 tag 已被修剪到 r26+，
        # 直接 dl.google.com 下载 r25c 压缩包钉死版本。
        env:
          NDK_SHA256: ${{ vars.NDK_R25C_SHA256 }}
        run: |
          set -euo pipefail
          : "${NDK_SHA256:?缺少仓库变量 NDK_R25C_SHA256；拒绝解压未钉摘要的 NDK}"
          curl -fsSL --retry 3 -o ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          echo "${NDK_SHA256}  ndk.zip" | sha256sum -c -
          unzip -q ndk.zip
          NDK_VER="$(sed -n 's/^Pkg.Revision = //p' android-ndk-r25c/source.properties)"
          echo "NDK 实际版本: ${NDK_VER}"
          case "${NDK_VER}" in
            25.2.*) echo "NDK=$PWD/android-ndk-r25c" >> "$GITHUB_ENV" ;;
            *) echo "::error::NDK ${NDK_VER} ≠ 25.2.x（r25c）——verify_so 的 stub 路径依赖 r25c 布局，拒绝构建" && exit 1 ;;
          esac

      - name: 📥 下载 9 个源码 tarball 并 sha256 硬校验
        run: |
          set -euo pipefail
          dl() { # dl <out> <sha256> <url>
            curl -fsSL --retry 3 -o "$1" "$3"
            echo "$2  $1" | sha256sum -c -
          }
          dl aria2.tar.gz    8e7021c6d5e8f8240c9cc19482e0c8589540836747744724d86bf8af5a21f0e8 \
            https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.gz
          dl openssl.tar.gz  cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8 \
            https://www.openssl.org/source/openssl-1.1.1w.tar.gz
          dl gmp.tar.xz      a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898 \
            https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
          dl nettle.tar.gz   ccfeff981b0ca71bbd6fbcb054f407c60ffb644389a5be80d6716d5b550c6ce3 \
            https://ftp.gnu.org/gnu/nettle/nettle-3.9.1.tar.gz
          dl gnutls.tar.xz   f74fc5954b27d4ec6dfbb11dea987888b5b124289a3703afcada0ee520f4173e \
            https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.3.tar.xz
          dl libxml2.tar.xz  60d74a257d1ccec0475e749cba2f21559e48139efba6ff28224357c7c798dfee \
            https://download.gnome.org/sources/libxml2/2.9/libxml2-2.9.14.tar.xz
          dl libssh2.tar.gz  3736161e41e2693324deb38c26cfdc3efe6209d634ba4258db1cecff6a5ad461 \
            https://github.com/libssh2/libssh2/releases/download/libssh2-1.11.0/libssh2-1.11.0.tar.gz
          dl sqlite.tar.gz   1c6719a148bc41cf0f2bbbe3926d7ce3f5ca09d878f1246fcc20767b175bb407 \
            https://www.sqlite.org/2023/sqlite-autoconf-3440200.tar.gz
          dl zlib.tar.gz     9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23 \
            https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz

          tar xzf aria2.tar.gz    && mv aria2-1.37.0            aria2-src
          tar xzf openssl.tar.gz  && mv openssl-1.1.1w          openssl-src
          tar xJf gmp.tar.xz      && mv gmp-6.3.0               gmp-src
          tar xzf nettle.tar.gz   && mv nettle-3.9.1            nettle-src
          tar xJf gnutls.tar.xz   && mv gnutls-3.8.3            gnutls-src
          tar xJf libxml2.tar.xz  && mv libxml2-2.9.14          libxml2-src
          tar xzf libssh2.tar.gz  && mv libssh2-1.11.0          libssh2-src
          tar xzf sqlite.tar.gz   && mv sqlite-autoconf-3440200 sqlite-src
          tar xzf zlib.tar.gz     && mv zlib-1.3.1              zlib-src

          echo "ARIA2_SRC=$PWD/aria2-src"     >> "$GITHUB_ENV"
          echo "OPENSSL_SRC=$PWD/openssl-src" >> "$GITHUB_ENV"
          echo "GMP_SRC=$PWD/gmp-src"         >> "$GITHUB_ENV"
          echo "NETTLE_SRC=$PWD/nettle-src"   >> "$GITHUB_ENV"
          echo "GNUTLS_SRC=$PWD/gnutls-src"   >> "$GITHUB_ENV"
          echo "XML2_SRC=$PWD/libxml2-src"    >> "$GITHUB_ENV"
          echo "SQLITE_SRC=$PWD/sqlite-src"   >> "$GITHUB_ENV"
          echo "SSH2_SRC=$PWD/libssh2-src"    >> "$GITHUB_ENV"
          echo "ZLIB_SRC=$PWD/zlib-src"       >> "$GITHUB_ENV"

      - name: 🛠 构建双 ABI × 双后端（含构建后自检）
        run: bash tools/build-aria2.sh

      - name: 📏 16K 页对齐检查（arm64 新产物）
        # verify_so 内部也查 LOAD 对齐，但这里用仓库的 check-so-alignment.py
        # 单独钉一道、输出独立成步骤（F-F-07 红线，16KB 页设备可加载的前提）。
        run: |
          python3 tools/check-so-alignment.py \
            out/arm64-v8a/libaria2c_ossl.so \
            out/arm64-v8a/libaria2c_gnutls.so

      - name: 🔬 与入库基线 .so 结构对拍
        # 基线 .so 随仓库检出在 lib/ 里。SONAME/NEEDED/导出符号/LOAD 对齐
        # 不一致即失败；size/NDK note 差异只展示（NDK 漂移属预期，入库前人工确认）。
        run: bash tools/aria2/compare-with-baseline.sh

      - name: 📋 产物 sha256 清单
        run: |
          cd out
          sha256sum */libaria2c_*.so | tee SHA256SUMS.txt

      - name: 🚚 替换仓库 .so + 刷新 pin + 提交（refresh_repo=true 时）
        if: ${{ inputs.refresh_repo }}
        env:
          : ${{ secrets. }}
        run: |
          set -euo pipefail
          # 1) 替换 4 枚 .so
          for abi in arm64-v8a armeabi-v7a; do
            for be in ossl gnutls; do
              cp "out/$abi/libaria2c_${be}.so" "lib/$abi/libaria2c_${be}.so"
            done
          done
          # 2) 刷新 THIRD-PARTY-NOTICES.md 与 baseline.json 的 aria2 sha256 pin
          python3 - <<'PY'
          import re, json
          notice, paths = {}, {}
          for line in open('out/SHA256SUMS.txt'):
              h, path = line.split()
              abi, fn = path.split('/')
              be = fn[len('libaria2c_'):-len('.so')]
              notice[(abi, be)] = h
              paths['lib/%s/%s' % (abi, fn)] = h   # 与 baseline.json 的 path 一致
          p = 'THIRD-PARTY-NOTICES.md'
          s = open(p, encoding='utf-8').read()
          for (abi, be), h in notice.items():
              pat = re.compile(r'(libaria2c_%s\.so`（%s）= )`[0-9a-f]+`' % (be, abi))
              s, n = pat.subn(r'\1`' + h + '`', s)
              assert n == 1, 'aria2 NOTICES pin %s/%s 未匹配' % (abi, be)
          open(p, 'w', encoding='utf-8').write(s)
          print('NOTICES aria2 sha256 pin 已刷新')
          bj = 'baseline/baseline.json'
          bd = json.load(open(bj, encoding='utf-8'))
          for op in bd['ops']:
              if op.get('kind') == 'add' and op.get('path') in paths:
                  op['post'] = paths[op['path']]
          open(bj, 'w', encoding='utf-8').write(json.dumps(bd, ensure_ascii=False, indent=2))
          print('baseline.json aria2 pin 已刷新')
          PY
          # 3) 提交 + 推送（core.hooksPath 走仓库钩子验证提交合规）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath tools/githooks
          git add lib/ THIRD-PARTY-NOTICES.md baseline/baseline.json
          # 可复现构建时新产物可能与入库一致（同一 NDK/路径/源码），此时没有
          # 可提交的变更——跳过提交，别让 no-op 把 CI 变红。
          if git diff --cached --quiet; then
            echo "✓ 无变化（产物与入库一致），跳过提交"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "$(cat <<'EOF'
          build(native): CI 重建 aria2 双后端 .so 并刷新 sha256 pin（refresh_repo）

          - 4 枚 libaria2c_{ossl,gnutls}.so（arm64-v8a/armeabi-v7a）替换为 CI 重建产物
          - THIRD-PARTY-NOTICES.md 的 aria2 sha256 pin 同步刷新

          文档: 已更新 THIRD-PARTY-NOTICES.md 的 aria2 sha256 pin

          Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          EOF
          )"
          # checkout 注入的 http.extraheader 带默认 token（github-actions[bot]，只读），
          # 会覆盖 URL 里的 PAT——push 前显式清掉，强制用 （维护者 PAT）。
          git -c http.extraheader= -c http.https://github.com/.extraheader= \
              push "https://x-access-token:${}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: 🚚 上传产物（.so + 清单 + 构建日志）
        uses: actions/upload-artifact@v7
        with:
          name: libaria2c-so
          path: |
            out/*/libaria2c_*.so
            out/SHA256SUMS.txt
            out/logs/
          if-no-files-found: error
