name: 🟢 全量回归 + last-green

# ╔════════════════════════════════════════════════════════════════════╗
# ║   main 每次 push 后的全量回归（协作方案第四节，见 CONTRIBUTING.md）   ║
# ╠════════════════════════════════════════════════════════════════════╣
# ║   比 main-checks 更「重」的一道：跑 tools/ 下全部测试套件，以及       ║
# ║   **不依赖工程树**的那部分守卫。要读重建后工程树的几个在             ║
# ║   build-apk.yml 里跑——守卫跟着它要检查的东西走。                    ║
# ║                                                                    ║
# ║   通过 → 把 `last-green` tag 移到本次提交。它是所有人的「时空锚点」： ║
# ║          拉到坏代码时 `git checkout last-green` 立刻回到稳定点。      ║
# ║   失败 → 🔴 红灯：在失败提交下留言标记；若配置了邮件通知               ║
# ║          （vars.NOTIFY_URL/NOTIFY_FROM/NOTIFY_FROM_NAME +             ║
# ║          secrets.NOTIFY_TO/NOTIFY_TOKEN）则同步发信。红灯期间         ║
# ║          只许修主线的提交（见 CONTRIBUTING.md「红灯协议」）。          ║
# ║                                                                    ║
# ║   tag 只是内部锚点，不是对外产物——不违反「不做自动发版」。            ║
# ╚════════════════════════════════════════════════════════════════════╝

on:
  push:
    branches: [main]

# 串行 + 不取消：保证 tag 严格按 push 顺序前移，不会被后跑的旧提交往回拖
concurrency:
  group: last-green
  cancel-in-progress: false

permissions:
  contents: write   # 移动 tag / 红灯留言

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📦 检出仓库
        uses: actions/checkout@v4
        with:
          # F-020：祖先校验需要全量历史（fetch-depth: 0）。
          # X-C3：不把 PAT 写进 .git/config（http.extraheader）。默认开启时，
          # 后续每个 step 里跑的任何代码（下载脚本、被污染的依赖）都能随手
          # 提走这个能绕过 ruleset 的写权限 PAT。关闭后，push 那步用
          # git -c 显式注入，凭证只存在于那一条命令的进程里。
          persist-credentials: false
          fetch-depth: 0

      - name: ☕ 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 📥 准备编译依赖（android.jar + OkHttp）
        run: |
          set -euo pipefail
          mkdir -p .cache/deps
          curl -sSL -o .cache/deps/platform.zip \
            "https://dl.google.com/android/repository/platform-33_r02.zip"
          # X-C3：四个依赖全部 sha256 钉死（实测自官方源，与 build-apk.yml
          # 同值）——它们进测试 classpath，被污染的 jar 会在回归测试里
          # 执行任意代码。
          echo "f851b13fe89f8510a1250df5e8593e86176b2428f4f3cbe0e304a85818c07bc8  .cache/deps/platform.zip" \
            | sha256sum -c -
          unzip -o -q -j .cache/deps/platform.zip "*/android.jar" -d .cache/deps
          rm -f .cache/deps/platform.zip
          curl -sSL -o .cache/deps/okhttp.jar \
            "https://repo1.maven.org/maven2/com/squareup/okhttp3/okhttp/3.12.13/okhttp-3.12.13.jar"
          echo "508234e024ef7e270ab1a6d5b356f5b98e786511239ca986d684fd1e2cf7bc82  .cache/deps/okhttp.jar" \
            | sha256sum -c -
          curl -sSL -o .cache/deps/okio.jar \
            "https://repo1.maven.org/maven2/com/squareup/okio/okio/1.17.5/okio-1.17.5.jar"
          echo "19a7ff48d86d3cf4497f7f250fbf295f430c13a528dd5b7b203f821802b886ad  .cache/deps/okio.jar" \
            | sha256sum -c -
          # 真 org.json：android.jar 里的全是 stub（方法一调就抛 "Stub!"），
          # 测试 JVM 上要跑真解析（requireJsonBody 的试解析）就得拿真实现，
          # 且 classpath 必须排在 android.jar **前面**才轮得到它。
          curl -sSL -o .cache/deps/orgjson.jar \
            "https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar"
          echo "0f18192df289114e17aa1a0d0a7f8372cc9f5c7e4f7e39adcf8906fe714fa7d3  .cache/deps/orgjson.jar" \
            | sha256sum -c -

      - name: 🧪 编译补丁源码与测试（与本地自检同 classpath）
        run: |
          set -euo pipefail
          # 先注入**占位**端点（example.test / *.pages.example，RFC 2606 保留域）。
          # 源码里 CNEndpoints 的主机名常量恒为空串，不注入的话白名单是空的、
          # 线路表是空的，SafeLinkTest 与 WebProxyTest 会整组红——而那是环境没
          # 备好，不是代码坏了。用占位域而不是真值：测试验的是判据，与线上用
          # 什么域名无关，真值也不该出现在公开的 CI 日志里。
          python3 tools/inject-endpoints.py --test
          # RestClient 只作为编译期桩存在：真实实现在 smali_classes2 里，
          # 不在 patch/src 下（与 build-apk.yml 里的处理方式一致）。
          mkdir -p .build/stubs/io/kamihama/magianative
          cat > .build/stubs/io/kamihama/magianative/RestClient.java <<'STUB'
          package io.kamihama.magianative;
          import android.app.Activity;
          public class RestClient {
              public static Activity getCurrentActivity() { return null; }
          }
          STUB
          mkdir -p .build-test
          javac -nowarn -source 8 -target 8 -encoding UTF-8 \
                -cp .cache/deps/android.jar \
                -d .build-test $(find patch/src/main/java -name '*.java') \
                tools/teststubs/android/webkit/WebResourceResponse.java tools/*Test.java \
                .build/stubs/io/kamihama/magianative/RestClient.java

      - name: 🧪 跑测试套件
        run: |
          set -euo pipefail
          python3 tools/proxy-test-server.py 8791 &
          python3 tools/server.py 8388608 8779 > /tmp/resume-server.log 2>&1 &
          sleep 1
          # 宿主 JVM 上 loadLibrary("archive") 会撞系统的 /usr/lib/libarchive.so
          # （无 CNZipTool JNI 导出）→ CNZipTool 误判可用、解压走 native 失败。
          # 空 java.library.path 强制 loadLibrary 失败 → 走 ZipFile 回退（宿主
          # 本来也跑不了 Android 的 libarchive.so）。见 libcnzip→libarchive 改名。
          mkdir -p empty-libs
          JLIB="-Djava.library.path=empty-libs"
          for t in HotUpdateTxTest HotUpdateMonotonicTest SafeLinkTest WebProxyTest ConfigGuardTest \
                   LogTest BgmLoopTest ThrottleTest FlushTest ChunkHashTest \
                   ManualRedownloadTest ArchiveInstallTxTest DownloadConcurrencyTest \
                   HotUpdateRoutingTest UiAssistStateTest DebugBridgeTest \
                   PathsTest LogFormatTest DownloadModeTest DebugOverlayTest \
                   DiskSpaceTest ZipPlanTest InstallCompleteTest LocalStoreTest; do
            java $JLIB -cp .build-test:.cache/deps/orgjson.jar:.cache/deps/android.jar $t
          done
          # DownloadRestartStateTest 在 io.kamihama.magianative 包里（要访问
          # CNDownloadRestart 的包内 API），不能用裸类名跑，所以不进上面那个循环。
          java $JLIB -cp .build-test:.cache/deps/orgjson.jar:.cache/deps/android.jar \
            io.kamihama.magianative.DownloadRestartStateTest
          java $JLIB -cp .build-test:.cache/deps/orgjson.jar:.cache/deps/android.jar ProxyFetchTest 8791
          # 分片下载/断点续传套件：打真实 HTTP 服务器（含故障注入）
          RESUME_SHA=$(awk '/payload sha256/{print $3}' /tmp/resume-server.log)
          java $JLIB -cp .build-test:.cache/deps/orgjson.jar:.cache/deps/android.jar \
            ResumeTest "http://127.0.0.1:8779/file.bin" "$RESUME_SHA" 8388608
          # 事务分块回归：85 请求并发上限、坏块不提交、非整除布局跨重启续传
          java $JLIB -cp .build-test:.cache/deps/orgjson.jar:.cache/deps/android.jar \
            ChunkHashIntegrationTest "http://127.0.0.1:8779/file.bin" 8388608 98690
          # 本地状态覆盖层的前端脚本（assets/magia/localstate.js）。它是整条链路里
          # 唯一跑在游戏页面里、Java 测试覆盖不到的一段，所以单独用 node 验一遍
          # 「savePrm ←→ userDeckList 行」的还原与覆盖行为。
          # runner 自带 node，不需要 setup-node。
          node --check assets/magia/localstate.js
          node tools/localstate-js-test.js

      - name: 🛡 跑全部守卫
        run: |
          set -euo pipefail
          # 把上一步注入的占位端点还原成空串：check-base-urls 会检查「入库的
          # 源码里注入位必须是空的」，带着注入结果跑等于自己把自己判红。
          python3 tools/inject-endpoints.py --reset
          # ⚠ check-fonts 与 check-webview-interceptor 已迁到 build-apk.yml。
          # 它们读的是**工程树**里的文件（字体、引擎 web 那几个 smali），而
          # 2026-08-14 起工程树不在仓库里了——要在这边跑就得先下 80 MB 重建一次，
          # 每次 push 都做不划算。守卫跟着它要检查的东西走。
          # check-class-table：README 的补丁层类表与实际类文件两边一一对应。
          # 2026-08-27 发现 54 个类里 18 个从没登记进表——漏的原因是「没有任何
          # 东西会因此报红」，这条就是那个落点。
          for g in check-proxy-hooks check-base-urls check-entry-guard \
                   check-branch-hygiene check-baseline check-third-party-notices \
                   check-debug-flag-boundary check-docs-fresh check-class-table; do
            python3 tools/$g.py
          done
          # 下载页新增合同：任意 ZIP 独立重下、动态热更身份、全局并发预算、
          # 真实横纵滚动、窄屏弹窗与当前 PID 日志必须同时成立。
          python3 tools/check-download-ui-contract.py
          # 重启/所有权状态机的合同（F-086/F-087）。
          python3 tools/check-download-restart-contract.py
          # 安装完成判据的 Java / native 跨语言等价（F-074）。抠出两边的
          # parseFinalFlag 各编一个 harness 跑同一张向量表——不依赖 NDK、
          # 不依赖 android.jar，几秒出结果。
          python3 tools/check-final-flag-parity.py
          # 开机看门狗的合同：必须排在前端 TopPage 超时之后、序章期间让开、
          # 一个进程只重载一次。这三条改错都会在真机上表现为「好好的一次加载
          # 被掀掉」，而静态编译一句都看不见。
          python3 tools/check-boot-watchdog-contract.py
          # 目录 fsync 的实现与契约：不许退回 RandomAccessFile（在 Android 上
          # 对目录必定 EISDIR，会让目录级持久化静默失效），实现只留一份，
          # 失败日志必须限流。
          python3 tools/check-dir-fsync-contract.py
          # F-088：同槽位热更提交单调性（每槽位锁 + 窗口内重读 + 单一 apply 点）。
          python3 tools/check-hotupdate-monotonic-contract.py
          # 日志热路径的线程安全：共享 SimpleDateFormat 只能在自己的监视器下用。
          python3 tools/check-log-threadsafety-contract.py
          # 「同一件事只有一份实现」：closeQuietly / appContext 曾经各有多份，
          # 而重复实现的危险在于它们会各自漂移、其中一份悄悄变成错的。
          python3 tools/check-single-impl-contract.py
          # 建连只有一个加固入口；aria2 的 loopback RPC 与 CNWebProxy 的透明代理
          # 是有理由的例外，守卫连例外一起钉。
          python3 tools/check-http-open-contract.py
          # 原生崩溃的墓碑必须收得到：主回收带 --pid，而墓碑是 crash_dump 用
          # 别的 PID 打的，只有第二路不带 --pid 的流看得见。这条一破，日志包
          # 看上去完全正常，只是永远没有崩溃现场。
          python3 tools/check-crash-capture-contract.py
          # i18n 查表路径的两条合同：① 译文缓冲必须是局部的——
          # MenuItemLabel::setString 会重入回 Label::setString，共享缓冲时两层
          # 会撞在同一块内存上；② 一次翻译只取一个快照——精确与前缀两级跨快照
          # 时，热重载落进中间就会得出两个版本都没写过、且无法复现的结果。
          python3 tools/check-i18n-lookup-contract.py
          # 调试开关三处目录（native kDebugFlags / Java KNOWN / 悬浮窗面板表）
          # 不许各说各话。2026-08-22 出过一次：native 删了 noProxyEndpoint，
          # 悬浮窗没删，玩家拨得动一个没人读的开关，而全套守卫都是绿的。
          python3 tools/check-debug-flag-catalog.py

          # 下一步那段「tag 该不该移」的判断只在 CI 上、只在特定时序下才执行到，
          # 错了全是沉默的（该拦没拦 = tag 被往回拖；该放没放 = 每次 push 都红）。
          # 这个自测把那段 shell 原样抠出来，离线跑四种时序。放在移 tag 之前：
          # 判断是坏的，就不该让它去动 tag。
          python3 tools/test-last-green-tag-move.py

      - name: 🟢 移动 last-green tag
        env:
          GH_PAT: ${{ secrets. }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force origin main:refs/remotes/origin/main
          git fetch --force origin "refs/tags/last-green:refs/tags/last-green" 2>/dev/null || true

          # F-020：last-green 只能向前移动。候选必须是 origin/main 祖先；
          # 旧 tag 必须已是候选的祖先。旧 run 乱序完成想回退 → 拒绝。
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::${GITHUB_SHA} 已不是 origin/main 的祖先"; exit 1; }

          OLD_DIRECT=""
          if git rev-parse -q --verify refs/tags/last-green >/dev/null; then
            OLD_DIRECT=$(git rev-parse refs/tags/last-green)
            OLD_COMMIT=$(git rev-parse 'refs/tags/last-green^{}')
            if ! git merge-base --is-ancestor "$OLD_COMMIT" "${GITHUB_SHA}"; then
              if git merge-base --is-ancestor "${GITHUB_SHA}" "$OLD_COMMIT"; then
                echo "last-green 已在更新的提交 $OLD_COMMIT；旧 run 不回退 tag"
                exit 0
              fi
              # 走到这里说明两个提交互不为祖先。有两种成因，后果相反：
              #
              #   ① 历史被整段重写过（filter-repo 或 rebase 整条主线）。旧 tag
              #      落在一条已经没人要的历史上，此时**必须**强制前移——否则
              #      tag 会一直钉着那段旧历史不放，而且本 job 每次 push 都红、
              #      tag 永远动不了。真撞过一次，只能靠人去网页删 tag 才解开。
              #   ② 真的分叉（有人把 main 推成了另一条线）。这种要拦。
              #
              # 分辨方法：旧 tag 的提交**还在不在 origin/main 上**。①里它已经
              # 不可达；②里它仍然可达（否则 main 自己就是被重写的那个，仍归①）。
              # 注意这一条不会削弱 F-020：它防的是「旧 run 把 tag 往回拖」，
              # 那种情形 OLD_COMMIT 一定是 origin/main 上的提交，已被上面两条
              # 分支拦住，落不到这里。
              if git merge-base --is-ancestor "$OLD_COMMIT" origin/main; then
                echo "::error::last-green（$OLD_COMMIT）仍在 origin/main 上却与候选分叉，拒绝强推"
                exit 1
              fi
              echo "::warning::last-green 原先指向 $OLD_COMMIT，该提交已不在 origin/main 上"
              echo "判定为历史被重写，强制把 tag 前移到 ${GITHUB_SHA}"
            fi
          fi
          git tag -f last-green "${GITHUB_SHA}"
          # X-C3：checkout 已 persist-credentials: false，凭证不落盘；
          # 这里用 git -c 把 PAT 只注入这一条 push 命令的进程（会被
          # Actions 日志自动打码），用完即随进程消失。
          # GitHub 的 git-over-HTTPS 端点只认 **Basic**（actions/checkout
          # 用的正是 basic base64(x-access-token:PAT)）；Bearer 头直接返回
          # HTTP 400，last-green tag 会永远推不动。base64 输出经 GITHUB_ENV
          # 之外的内联命令替换，不留盘。
          # force-with-lease 而非无脑 -f：远端 tag 已被别的 run 推进时，
          # lease（期望旧值 = OLD_DIRECT）对不上，push 失败，防并发回退。
          AUTH="Authorization: basic $(printf 'x-access-token:%s' "${GH_PAT}" | base64 | tr -d '\n')"
          if [ -n "$OLD_DIRECT" ]; then
            git -c "http.https://github.com/.extraheader=$AUTH" \
              push --force-with-lease="refs/tags/last-green:$OLD_DIRECT" \
              origin refs/tags/last-green
          else
            git -c "http.https://github.com/.extraheader=$AUTH" \
              push origin refs/tags/last-green
          fi
          echo "last-green → ${GITHUB_SHA}"

      - name: 🔴 红灯标记（回归失败时）
        if: failure()
        env:
          : ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 邮件通知渠道（宝塔 webhook 格式）：地址与发件人走仓库变量，
          # 收件人与 Bearer 令牌走 secret（收件人明文放变量里等于公开
          # 通讯录）。NOTIFY_TO 可用逗号/分号/空格配多个收件人。
          # 未配齐则整段跳过。
          NOTIFY_URL: ${{ vars.NOTIFY_URL }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM }}
          NOTIFY_FROM_NAME: ${{ vars.NOTIFY_FROM_NAME }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: |
          # 注意：本步骤刻意不用 set -e。它是失败后的通知步骤，任何一路通知
          # 出问题（网络抖动、令牌过期、变量没配）都不许连锁灭掉另一路，
          # 更不能让「通知失败」再把 job 的失败原因搅浑。每路各自报 HTTP 码。
          set -uo pipefail
          MSG=$(printf '🔴 **红灯**：main 全量回归在本提交失败（%s）。\n\n红灯期间只许修复主线的提交，新功能本地继续但不许 push（见 CONTRIBUTING.md「红灯协议」）。\n引入者负责修；修不了就先 `git revert` 恢复绿灯。稳定锚点：`git checkout last-green`。' "$RUN_URL")
          printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))' > /tmp/red.json
          CODE=$(curl -sS -o /tmp/red.resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/commits/${SHA}/comments" \
            -d @/tmp/red.json || echo "curl-failed")
          if [ "$CODE" = "201" ]; then
            echo "已在 ${SHA} 下标记红灯"
          else
            echo "::warning::提交留言失败（HTTP ${CODE}）：$(head -c 300 /tmp/red.resp 2>/dev/null)"
          fi
          # 邮件通知：共用脚本（变量未配齐/发送失败都不会影响本步骤）
          TITLE="🔴 main 红灯：全量回归失败" MSG="$MSG" \
            bash tools/notify-mail.sh
          exit 0
