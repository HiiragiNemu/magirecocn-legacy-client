name: one-shot-apply-final-download-ui
# retry-3: explicit split chunk 01

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ui-resource-manager-final-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify audited baseline and payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object patch/src/main/java/io/kamihama/magianative/CNDownloadUiAssist.java)" = "ba1c3c8033840c205165feee6a1644e41d373e2c"
          test "$(git hash-object patch/src/main/java/io/kamihama/magianative/CNCNDownloadUI.java)" = "fff4f29a0c79ec3bb21d03c5815302eff2c79e0d"
          test "$(git hash-object patch/src/main/java/io/kamihama/magianative/CNHotUpdateCheck.java)" = "54f8e01423d7b303d1365af31b8115fcc36aff18"
          test "$(git hash-object patch/src/main/java/io/kamihama/magianative/CNDownloaderFix.java)" = "c5238a94cf59fbe44835aa4fd2141d7ef829ee2f"
          test "$(git hash-object patch/src/main/java/io/kamihama/magianative/CNManualRedownload.java)" = "90294720af0011f9dae68deea85c25740f8cce5b"
          test "$(git hash-object tools/ManualRedownloadTest.java)" = "42a8807688e89217632cfc494a74877348123b79"
          test "$(git hash-object docs/DOWNLOAD_TRANSACTIONAL_CHUNKS.md)" = "ef607122d7c79831f1bc52cfef58a0089b4faa9b"

          cat \
            .github/patch-payload/ui-final-payload-00 \
            .github/patch-payload/ui-final-payload-01a \
            .github/patch-payload/ui-final-payload-01b \
            .github/patch-payload/ui-final-payload-01c \
            .github/patch-payload/ui-final-payload-02 \
            .github/patch-payload/ui-final-payload-03 \
            > /tmp/ui-final-payload.b64
          echo "dd50d627939781737760f1b0d9e217119a23a7128b9ff68685c12adb2428ad08  /tmp/ui-final-payload.b64" | sha256sum -c -
          base64 -d /tmp/ui-final-payload.b64 > /tmp/ui-final-payload.tar.gz
          echo "4869950ee103d9a1640b0a450649021710ce6ed4de9d23af5e477b602ea4ef8a  /tmp/ui-final-payload.tar.gz" | sha256sum -c -
          mkdir -p /tmp/ui-final-payload
          tar -C /tmp/ui-final-payload -xzf /tmp/ui-final-payload.tar.gz
          echo "543282167462ae8c7f52bd3888211f225f707eacc56431dccb7b3319bfbce7dc  /tmp/ui-final-payload/CNDownloadUiAssist.java" | sha256sum -c -
          echo "d9bdc5a8c90c9b994d2a86924a061ae8eb361a664a14954d668b2498a1a37962  /tmp/ui-final-payload/UiAssistStateTest.java" | sha256sum -c -
          echo "31d11e8757e4b3e4b60e62af2e9998bde679e23155dba54f6e977a4f42b86c2a  /tmp/ui-final-payload/check-download-ui-contract.py" | sha256sum -c -
          echo "5b2e35e5f4c06cf8c2923a24a1d57ce335df39c46eeb15bb94d5bd6096293eda  /tmp/ui-final-payload/apply_patch.py" | sha256sum -c -

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -w0 /tmp/ui-final-payload/CNDownloadUiAssist.java > .github/patch-payload/ui-final-helper.b64
          base64 -w0 /tmp/ui-final-payload/UiAssistStateTest.java > .github/patch-payload/ui-final-state-test.b64
          base64 -w0 /tmp/ui-final-payload/check-download-ui-contract.py > .github/patch-payload/ui-final-contract-guard.b64
          python3 /tmp/ui-final-payload/apply_patch.py
          chmod +x tools/check-download-ui-contract.py
          python3 tools/check-download-ui-contract.py
          git diff --check

      - name: Compile all Java sources and run new state tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/deps .build/stubs/io/kamihama/magianative .build-test
          curl -sSL -o .cache/deps/platform.zip \
            "https://dl.google.com/android/repository/platform-33_r02.zip"
          unzip -o -q -j .cache/deps/platform.zip "*/android.jar" -d .cache/deps
          rm -f .cache/deps/platform.zip
          curl -sSL -o .cache/deps/orgjson.jar \
            "https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar"
          cat > .build/stubs/io/kamihama/magianative/RestClient.java <<'STUB'
          package io.kamihama.magianative;
          import android.app.Activity;
          public class RestClient {
              public static Activity getCurrentActivity() { return null; }
          }
          STUB
          javac -nowarn -source 8 -target 8 -encoding UTF-8 \
            -cp .cache/deps/android.jar \
            -d .build-test $(find patch/src/main/java -name '*.java') \
            tools/teststubs/android/webkit/WebResourceResponse.java tools/*Test.java \
            .build/stubs/io/kamihama/magianative/RestClient.java
          java -cp .build-test:.cache/deps/orgjson.jar:.cache/deps/android.jar ManualRedownloadTest
          java -cp .build-test:.cache/deps/orgjson.jar:.cache/deps/android.jar UiAssistStateTest

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/patch-payload
          git add -A .github/patch-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            patch/src/main/java/io/kamihama/magianative/CNDownloadUiAssist.java \
            patch/src/main/java/io/kamihama/magianative/CNCNDownloadUI.java \
            patch/src/main/java/io/kamihama/magianative/CNHotUpdateCheck.java \
            patch/src/main/java/io/kamihama/magianative/CNDownloaderFix.java \
            patch/src/main/java/io/kamihama/magianative/CNManualRedownload.java \
            tools/ManualRedownloadTest.java tools/UiAssistStateTest.java \
            tools/check-download-ui-contract.py \
            docs/DOWNLOAD_TRANSACTIONAL_CHUNKS.md
          git commit -m "fix(ui): 完成内嵌显示、停留与指定 ZIP 重下" \
            -m "彻底移除 decorView 外挂与整屏平移；中央内容进入固定视口，右侧/底部使用常驻长滚动条，Aa 胶囊只缩放下载页中央内容。停留本页成为真实状态，手动选择序章‘否’不再重启或离页。" \
            -m "指定 ZIP 重下只撤销所选 marker 与下载产物，其他 14 项必须先验证；热更新两包同步归零对应版本号，失败时完整回滚。" \
            -m "文档: 更新 docs/DOWNLOAD_TRANSACTIONAL_CHUNKS.md" \
            -m "Co-authored-by: Codex <noreply@openai.com>"
          git push origin HEAD:main
