name: one-shot-apply-stay-contract

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stay-contract-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply explicit stay contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-stay-contract.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch/src/main/java/io/kamihama/magianative/CNHotUpdateCheck.java
          git add patch/src/main/java/io/kamihama/magianative/CNDownloaderFix.java
          git commit -m "fix(ui): 停留按钮真正阻断进入游戏" \
            -m "热更新结论页和首次安装收尾都直接等待显式停留状态释放；停留不受 120 秒自动窗口限制，也不再依赖隐藏后重新挂浮层。玩家点‘进入游戏’后才收页面并继续启动或重启。" \
            -m "文档: 沿用 DOWNLOAD_TRANSACTIONAL_CHUNKS.md 的停留合同" \
            -m "Co-authored-by: Codex <noreply@openai.com>"
          git push origin HEAD:main
