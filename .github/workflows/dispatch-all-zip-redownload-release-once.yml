name: one-shot-dispatch-all-zip-redownload-release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-all-zip-redownload-release-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for cleanup and dispatch official APK release
        env:
          : ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 45
          if gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/dispatch-all-zip-redownload-release-once.yml?ref=main" >/dev/null 2>&1; then
            echo "::error::temporary release dispatcher remains on main"
            exit 1
          fi
          CLEAN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          gh workflow run build-apk.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f verify_only=false
          echo "release_source_sha=${CLEAN_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "features=all-zip-independent-redownload,dynamic-hot-update-identity,global-8-connection-budget,responsive-download-ui" >> "$GITHUB_STEP_SUMMARY"
