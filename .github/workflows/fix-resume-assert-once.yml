name: one-shot-resume-assert-fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-resume-assert-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update assertion and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/ResumeTest.java")
          s = p.read_text(encoding="utf-8")
          old = 'msg.contains("\u603b\u957f\u4e0d\u7b26")'
          new = 'msg.contains("Content-Range")'
          if old not in s:
              raise SystemExit("expected assertion not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          git rm .github/workflows/fix-resume-assert-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ResumeTest.java
          git commit -m "test(download): accept strict Content-Range rejection" \
                     -m "Only the error-text contract changes; stale totals are still rejected and no target file is committed." \
                     -m "Co-authored-by: Codex <noreply@openai.com>"
          git push origin HEAD:main
          git push origin --delete noop || true
