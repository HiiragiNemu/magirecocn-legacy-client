name: one-shot-dispatch-clean-main-release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-clean-main-release-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for connector cleanup, then dispatch clean main
        env:
          : ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 45
          if gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/dispatch-clean-main-release-once.yml?ref=main" >/dev/null 2>&1; then
            echo "::error::temporary dispatcher is still present on main; refusing to release an unclean source tree"
            exit 1
          fi
          CLEAN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          gh workflow run build-apk.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f verify_only=false
          echo "release_source_sha=${CLEAN_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "dispatched=build-apk.yml verify_only=false" >> "$GITHUB_STEP_SUMMARY"
