name: one-shot-byte-overrun-compat

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-byte-overrun-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clamp excess body bytes in no-manifest path and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("patch/src/main/java/io/kamihama/magianative/CNChunkedDownload.java")
          s = p.read_text(encoding="utf-8")
          old = '                if (received + n > expected) throw new IOException("分段响应越界");\n                raf.write(buf, 0, n);'
          new = '''                // 无清单兼容路径：响应头已经严格回验为请求区间时，若中间设备仍在\n                // 正文尾部多发字节，只接收声明区间内的部分并在下一轮退出。绝不能\n                // 把越界正文写进相邻分段；有清单的事务块路径仍对任何越界严格拒绝。\n                if (received + n > expected) {\n                    n = (int) (expected - received);\n                    if (n <= 0) break;\n                }\n                raf.write(buf, 0, n);'''
          if old not in s:
              raise SystemExit("expected overrun guard not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          git rm .github/workflows/fix-byte-overrun-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch/src/main/java/io/kamihama/magianative/CNChunkedDownload.java
          git commit -m "fix(download): clip excess body in no-manifest segments" \
                     -m "After strict 206, Content-Range and Content-Length validation, accept only bytes inside the declared range and discard any excess body bytes. Transactional manifest blocks remain strict." \
                     -m "Co-authored-by: Codex <noreply@openai.com>"
          git push origin HEAD:main
