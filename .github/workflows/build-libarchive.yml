name: 🔧 构建 libarchive.so

# 重建 libarchive.so（libarchive 3.7.4 + zlib 静态链的 JNI 解压库，两 ABI）。
# libarchive.so 曾以 libcnzip.so 之名一次性手工交叉编译、CI 从不重建——源码侧的
# 安全修复（Zip Slip / 吞错 / 膨胀比闸）永远到不了设备。本 workflow 让重建
# 可复现：手动触发，产物作为 artifact 上传，下载后替换 lib/<abi>/libarchive.so。
#
# 默认只产出 .so artifact 不入库。勾选「refresh_repo」时，构建后直接把 2 枚
# libarchive.so 替换进仓库 lib/ 并刷新 THIRD-PARTY-NOTICES.md 的 sha256 pin，
# 提交推 main。⚠ 会改动仓库二进制：哈希必变，真机验证通过后再勾选。
on:
  workflow_dispatch:
    inputs:
      libarchive_tag:
        description: 'libarchive 版本 tag（默认 v3.7.4，与基线一致）'
        type: string
        default: 'v3.7.4'
      zlib_tag:
        description: 'zlib 版本 tag'
        type: string
        default: 'v1.3.1'
      refresh_repo:
        description: '构建后直接替换仓库 lib/ 下的 .so 并刷新 sha256 pin 提交推 main（真机验证后再用）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📦 检出仓库
        uses: actions/checkout@v4

      - name: 📍 定位 NDK
        run: |
          echo "NDK=${ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
          echo "NDK 主机工具链: ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # R3-03：NDK 版本未钉死（用 runner 自带镜像），版本漂移会静默改变
          # 产物的 note/工具链行为。打印实际版本并与本次 baseline pin 对应的
          # 期望值（r27d）比对：不符只 WARN 不失败（runner 升级属正常演进，
          # 但重建出的 .so 若换了 NDK，入库前必须重新做基线取证）。
          NDK_VER="$(sed -n 's/^Pkg.Revision = //p' "${ANDROID_NDK_HOME}/source.properties" 2>/dev/null || echo unknown)"
          echo "NDK 实际版本: ${NDK_VER}"
          case "${NDK_VER}" in
            27.*) ;;  # 期望：r27d 系（2026-08-17 baseline pin 的构建环境）
            *) echo "::warning::NDK 版本为 ${NDK_VER}，非期望的 r27d 系——重建产物入库前请重新核对 baseline pin 与二进制取证" ;;
          esac

      - name: 📥 下载 libarchive + zlib 源码
        env:
          # R4-02：inputs 经 env 传递，绝不把 ${{ github.event.inputs.* }}
          # 直接插值进 run 脚本（脚本注入面）。
          LA_TAG: ${{ github.event.inputs.libarchive_tag }}
          ZL_TAG: ${{ github.event.inputs.zlib_tag }}
        run: |
          set -euo pipefail
          # tag 形态白名单：vX.Y.Z（防 env 值里塞 shell 元字符/路径）
          [[ "$LA_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::libarchive_tag 形态非法: $LA_TAG"; exit 1; }
          [[ "$ZL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::zlib_tag 形态非法: $ZL_TAG"; exit 1; }
          # zlib 的 release 资产名是 zlib-1.3.1.tar.gz（tag 是 v1.3.1，资产不带 v）
          LA_VER="${LA_TAG#v}"
          ZL_VER="${ZL_TAG#v}"
          curl -fsSL -o libarchive.tar.gz \
            "https://github.com/libarchive/libarchive/archive/refs/tags/${LA_TAG}.tar.gz"
          curl -fsSL -o zlib.tar.gz \
            "https://github.com/madler/zlib/releases/download/${ZL_TAG}/zlib-${ZL_VER}.tar.gz"
          # R3-02/R4-01：源码 tarball 同可执行构件一样钉 sha256（X-C3 纪律）。
          # 源码编出的 .so 直接进解压路径，带毒源码 = 带毒解压器。
          # 默认 tag 用钉死值；换 tag 必须同步改这里，否则校验失败即停。
          LA_SHA256_v3_7_4="cf7fc85b9f663c06dc2b7036b7ee54d02712167e04b07bdcc4c27553abf2d6ff"
          ZL_SHA256_v1_3_1="9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
          if [ "$LA_TAG" != "v3.7.4" ] || [ "$ZL_TAG" != "v1.3.1" ]; then
            echo "::error::使用了非默认 tag（$LA_TAG / $ZL_TAG）——请先把对应 tarball 的 sha256 钉进本步骤再运行"
            exit 1
          fi
          echo "$LA_SHA256_v3_7_4  libarchive.tar.gz" | sha256sum -c -
          echo "$ZL_SHA256_v1_3_1  zlib.tar.gz" | sha256sum -c -
          tar xzf libarchive.tar.gz && mv "libarchive-${LA_VER}" libarchive-src
          tar xzf zlib.tar.gz && mv "zlib-${ZL_VER}" zlib-src
          echo "LIBARCHIVE_SRC=$PWD/libarchive-src" >> "$GITHUB_ENV"
          echo "ZLIB_SRC=$PWD/zlib-src" >> "$GITHUB_ENV"

      - name: 🩹 修补 libarchive CMakeLists（Android 无 libmd，跳过探测）
        run: |
          # libarchive 无条件探测 FreeBSD libmd，Android 上没有 → LIBMD_LIBRARY
          # NOTFOUND 硬报错。注释掉该行（加密能力非解压必需，禁用可接受）。
          sed -i 's|^CHECK_CRYPTO("MD5;RMD160;SHA1;SHA256;SHA512" LIBMD)$|# CHECK_CRYPTO("MD5;RMD160;SHA1;SHA256;SHA512" LIBMD)   # Android 无 libmd，跳过|' \
            libarchive-src/CMakeLists.txt
          grep -q "libmd，跳过" libarchive-src/CMakeLists.txt && echo "✓ LIBMD 探测已跳过"

      - name: 🛠 构建两 ABI
        run: bash tools/build-libarchive.sh

      - name: 📏 16K 页对齐检查（arm64 新产物）
        run: |
          python3 tools/check-so-alignment.py out/arm64-v8a/libarchive.so

      - name: 🚚 替换仓库 .so + 刷新 pin + 提交（refresh_repo=true 时）
        if: ${{ inputs.refresh_repo }}
        env:
          : ${{ secrets. }}
        run: |
          set -euo pipefail
          # 1) 替换 2 枚 .so
          for abi in arm64-v8a armeabi-v7a; do
            cp "out/$abi/libarchive.so" "lib/$abi/libarchive.so"
          done
          # 2) 刷新 THIRD-PARTY-NOTICES.md 与 baseline.json 的 libarchive sha256 pin
          sha256sum out/*/libarchive.so > /tmp/la-sha256.txt
          python3 - <<'PY'
          import re, json
          notice, paths = {}, {}
          for line in open('/tmp/la-sha256.txt'):
              h, path = line.split()
              abi = path.split('/')[-2]
              notice[abi] = h
              paths['lib/%s/libarchive.so' % abi] = h   # 与 baseline.json 的 path 一致
          p = 'THIRD-PARTY-NOTICES.md'
          s = open(p, encoding='utf-8').read()
          for abi, h in notice.items():
              pat = re.compile(r'(libarchive\.so`（%s）= )`[0-9a-f]+`' % abi)
              s, n = pat.subn(r'\1`' + h + '`', s)
              assert n == 1, 'libarchive NOTICES pin %s 未匹配' % abi
          open(p, 'w', encoding='utf-8').write(s)
          print('NOTICES libarchive sha256 pin 已刷新')
          bj = 'baseline/baseline.json'
          bd = json.load(open(bj, encoding='utf-8'))
          for op in bd['ops']:
              if op.get('kind') == 'add' and op.get('path') in paths:
                  op['post'] = paths[op['path']]
          open(bj, 'w', encoding='utf-8').write(json.dumps(bd, ensure_ascii=False, indent=2))
          print('baseline.json libarchive pin 已刷新')
          PY
          # 3) 提交 + 推送（core.hooksPath 走仓库钩子验证提交合规）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath tools/githooks
          git add lib/ THIRD-PARTY-NOTICES.md baseline/baseline.json
          # 可复现构建时新产物可能与入库一致（同一 NDK/路径/源码），此时没有
          # 可提交的变更——跳过提交，别让 no-op 把 CI 变红。
          if git diff --cached --quiet; then
            echo "✓ 无变化（产物与入库一致），跳过提交"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "$(cat <<'EOF'
          build(native): CI 重建 libarchive.so 并刷新 sha256 pin（refresh_repo）

          - 2 枚 libarchive.so（arm64-v8a/armeabi-v7a）替换为 CI 重建产物
          - THIRD-PARTY-NOTICES.md 的 libarchive sha256 pin 同步刷新

          文档: 已更新 THIRD-PARTY-NOTICES.md 的 libarchive sha256 pin

          Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          EOF
          )"
          # checkout 注入的 http.extraheader 带默认 token（github-actions[bot]，只读），
          # 会覆盖 URL 里的 PAT——push 前显式清掉，强制用 （维护者 PAT）。
          git -c http.extraheader= -c http.https://github.com/.extraheader= \
              push "https://x-access-token:${}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: 🚚 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: libarchive-so
          path: out/*/libarchive.so
          if-no-files-found: error
