name: 🏗️ 构建 APK

# ╔════════════════════════════════════════════════════════════════════╗
# ║   legacy-client —— APK 构建                              ║
# ╠════════════════════════════════════════════════════════════════════╣
# ║                                                                    ║
# ║ 与 （旧客户端仓库） 的差异（重要）                               ║
# ║ ─────────────────────────────────                                  ║
# ║   ▸ 本仓库的 smali 已经是**打好补丁的成品**，不需要注入构建期常量：   ║
# ║     没有 API_HOST / DIRECTORY_PUBKEY 之类的信任锚，因此不需要任何    ║
# ║     Secret 或 Variable 就能构建。                                   ║
# ║   ▸ 签名用 **AOSP testkey**，由 CI 从 android.googlesource.com 取，  ║
# ║     不入库、也不需要 keystore Secret。这与上游发行的包是同一把 key， ║
# ║     所以产物可以直接覆盖安装。                                       ║
# ║   ▸ 没有 （旧 native 层） / HCA 转码 / 音频资源等步骤——那些是 （旧客户端）  ║
# ║     独有的，本仓库不涉及。                                          ║
# ║                                                                    ║
# ║ 构建流程                                                            ║
# ║ ───────                                                            ║
# ║   0. 注入客户端版本号 1.0.<run_number>（强制更新通道的本端版本，       ║
# ║      与 APK 自身 versionName/versionCode 无关）                     ║
# ║   1. 编译 patch/src/main/java/ 下的 Java 补丁源码                   ║
# ║   2. d8 转成 dex，baksmali 解码回 smali                           ║
# ║   3. 用生成的 smali 覆盖 smali_classes2/ 与 smali_classes3/ 中       ║
# ║      对应的补丁类（Java 源码是唯一事实来源）                         ║
# ║   4. apktool b 重组                                                 ║
# ║   5. zipalign + apksigner（AOSP testkey）                           ║
# ║   6. 上传为 workflow artifact                                       ║
# ║                                                                    ║
# ║ 触发方式：仅手动（workflow_dispatch）。                             ║
# ║ 与 （旧客户端） 一样不做自动发版——本仓库是既有产物的存档与再构建，     ║
# ║ 不应该因为一次 push 就产出新的对外 APK。                             ║
# ╚════════════════════════════════════════════════════════════════════╝

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: '只构建校验，不上传产物'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🛡️ 安全护栏（校验仓库白名单）
        run: |
          set -euo pipefail
          # 防止 fork 出去的副本误用本工作流去产出「看起来官方」的包
          ALLOWED="magirecocn-revival-project/legacy-client"
          if [ "${GITHUB_REPOSITORY,,}" != "${ALLOWED,,}" ]; then
            echo "::error::本工作流仅允许在 ${ALLOWED} 内运行，当前为 ${GITHUB_REPOSITORY}"
            exit 1
          fi
          echo "仓库校验通过：${GITHUB_REPOSITORY}"

      - name: 📦 检出仓库
        uses: actions/checkout@v4

      - name: ☕ 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🔧 安装构建工具（apktool / baksmali / SDK）
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/local/bin

          # ── apktool 2.9.3 ────────────────────────────────────────────
          curl -sSL -o /tmp/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"
          sudo mv /tmp/apktool.jar /usr/local/bin/apktool.jar
          printf '#!/bin/bash\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' \
            | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool

          # ── baksmali 3.0.9（Google 维护的延续版本，tag 无 v 前缀）──────
          curl -sSL -o /tmp/baksmali.jar \
            "https://github.com/baksmali/smali/releases/download/3.0.9/baksmali-3.0.9-fat-release.jar"
          sudo mv /tmp/baksmali.jar /usr/local/bin/baksmali.jar
          printf '#!/bin/bash\nexec java -jar /usr/local/bin/baksmali.jar "$@"\n' \
            | sudo tee /usr/local/bin/baksmali > /dev/null
          sudo chmod +x /usr/local/bin/baksmali

          # ── Android SDK build-tools（d8 / zipalign / apksigner）──────
          BT_DIR="$(ls -d "${ANDROID_HOME}"/build-tools/*/ 2>/dev/null | sort -r | head -1 || true)"
          if [ -z "${BT_DIR}" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null
            BT_DIR="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -r | head -1)"
          fi
          echo "BT_DIR=${BT_DIR%/}" >> "$GITHUB_ENV"
          echo "build-tools: ${BT_DIR}"

          apktool --version
          "${BT_DIR%/}/apksigner" --version

      - name: 📥 准备编译依赖（android.jar + OkHttp）
        run: |
          set -euo pipefail
          # classpath 与 （旧客户端仓库） 保持一致：android.jar + OkHttp/Okio。
          # 补丁源码只用 JDK 自带能力与 Android 框架，不引第三方库。
          mkdir -p .cache/deps
          curl -sSL -o .cache/deps/platform.zip \
            "https://dl.google.com/android/repository/platform-33_r02.zip"
          unzip -o -q -j .cache/deps/platform.zip "*/android.jar" -d .cache/deps
          rm -f .cache/deps/platform.zip
          curl -sSL -o .cache/deps/okhttp.jar \
            "https://repo1.maven.org/maven2/com/squareup/okhttp3/okhttp/3.12.13/okhttp-3.12.13.jar"
          curl -sSL -o .cache/deps/okio.jar \
            "https://repo1.maven.org/maven2/com/squareup/okio/okio/1.17.5/okio-1.17.5.jar"
          ls -la .cache/deps

      - name: 🚧 校验 native 入口保护（异常绝不外泄）
        run: python3 tools/check-entry-guard.py

      - name: 🔢 注入客户端版本号（构建号）
        run: |
          set -euo pipefail
          # 客户端版本通道的「本端版本」在这里定：1.0.<run_number>，每个构建
          # 单调递增，可回溯到具体 workflow run。mirrors.json 的 client.version
          # 抬过它，旧包启动时就会弹强制更新框。
          # 注意这与 APK 的 versionName/versionCode 无关——那是上游包的身份，
          # 不能动。cpp 里的字面量只是本地构建（build-local.sh）的兜底。
          VER="1.0.${GITHUB_RUN_NUMBER}"
          echo "客户端版本号: ${VER}"
          sed -i -E "s/CLIENT_VERSION = \"[^\"]+\"/CLIENT_VERSION = \"${VER}\"/" \
            magia-native/src/MagiaLegacy.cpp
          grep -q "CLIENT_VERSION = \"${VER}\"" magia-native/src/MagiaLegacy.cpp \
            || { echo "::error::版本号注入失败（CLIENT_VERSION 常量没匹配上）"; exit 1; }
          echo "CLIENT_VERSION=${VER}" >> "$GITHUB_ENV"

      - name: 🛠 编译 libMagiaLegacy.so（magia-native）
        run: |
          set -euo pipefail
          # 取代原先包内两个预编译的 Dobby hook 库：
          #   libuwasa.so   一改：端点重定向（顺带按英文行宽重排剧情文本，正是要去掉的）
          #   libcn_hook.so 二改：拦引擎下载入口接我们的浮层
          NDK_ROOT="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_BASE="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk"
            NDK_ROOT="$(ls -1d $NDK_BASE/* 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            echo "::error::找不到 Android NDK"; exit 1
          fi
          echo "[NDK] 使用 $NDK_ROOT"
          # shadowhook v1.1.1 的 CMakeLists 要求 CMake >= 3.30.5，
          # 低于此版本会在 configure 阶段直接失败
          cmake --version | head -1

          STRIP="$(find "$NDK_ROOT/toolchains/llvm/prebuilt" -name llvm-strip 2>/dev/null | head -1)"
          for ABI in arm64-v8a armeabi-v7a; do
            BUILD_DIR="magia-native/build/$ABI"
            cmake -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-21 \
              -DCMAKE_BUILD_TYPE=Release \
              -B "$BUILD_DIR" magia-native
            cmake --build "$BUILD_DIR" --parallel
            SO="$BUILD_DIR/libMagiaLegacy.so"
            if [ ! -f "$SO" ]; then echo "::error::[$ABI] 未产出 libMagiaLegacy.so"; exit 1; fi
            cp "$SO" "lib/$ABI/libMagiaLegacy.so"
            [ -n "$STRIP" ] && "$STRIP" --strip-unneeded "lib/$ABI/libMagiaLegacy.so"
            # shadowhook 是**动态库**，libMagiaLegacy 对它有 DT_NEEDED，
            # 必须一并打包——漏了的话 APK 照样能打能签能装，但真机启动时
            # dlopen failed: library "libshadowhook.so" not found。这个坑踩过一次。
            SH="$BUILD_DIR/_deps/shadowhook-build/libshadowhook.so"
            if [ ! -f "$SH" ]; then echo "::error::[$ABI] 未产出 libshadowhook.so"; exit 1; fi
            cp "$SH" "lib/$ABI/libshadowhook.so"
            [ -n "$STRIP" ] && "$STRIP" --strip-unneeded "lib/$ABI/libshadowhook.so"
            echo "[$ABI] MagiaLegacy=$(du -h lib/$ABI/libMagiaLegacy.so | cut -f1) shadowhook=$(du -h lib/$ABI/libshadowhook.so | cut -f1)"
          done

          # 旧库必须已从包内移除，否则会与新库对同一地址重复装 hook
          for f in lib/arm64-v8a/libuwasa.so lib/armeabi-v7a/libuwasa.so lib/arm64-v8a/libcn_hook.so; do
            if [ -e "$f" ]; then echo "::error::$f 仍然存在，会与 libMagiaLegacy 冲突"; exit 1; fi
          done

      - name: 🎵 转换 BGM：HCA → OGG（vgmstream + ffmpeg）
        run: |
          set -euo pipefail
          # assets 里的 BGM 是 CRI HCA 且 ciphType=56（加密），Android 放不了。
          # vgmstream 自带 CRI 游戏的密钥库，能直接解；再用 ffmpeg 转 OGG。
          # 与 （旧客户端仓库） 的同名步骤同一套做法。
          mkdir -p .cache/audio

          # vgmstream：官网的下载链接指向 vgmstream-releases 的 nightly 资产
          curl -sSL -o .cache/audio/vgms.tar.gz \
            "https://github.com/vgmstream/vgmstream-releases/releases/download/nightly/vgmstream-linux-cli.tar.gz"
          mkdir -p .cache/audio/vgms
          tar xzf .cache/audio/vgms.tar.gz -C .cache/audio/vgms
          VGMS="$(find .cache/audio/vgms -name vgmstream-cli -type f | head -1)"
          chmod +x "${VGMS}"

          # ffmpeg：不走 apt（源不稳），直接拉 BtbN 的静态构建（含 libvorbis）
          curl -sSL -o .cache/audio/ff.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          mkdir -p .cache/audio/ff
          tar xJf .cache/audio/ff.tar.xz -C .cache/audio/ff
          FF="$(find .cache/audio/ff -name ffmpeg -type f | head -1)"
          chmod +x "${FF}"

          python3 tools/convert-bgm.py --vgmstream "${VGMS}" --ffmpeg "${FF}"

          # 产物必须齐全：缺了浮层就没有 BGM。音频不是关键路径，只告警不阻断。
          for f in assets/magia/bgm1.ogg assets/magia/bgm2.ogg assets/magia/bgm.json; do
            if [ ! -s "${f}" ]; then echo "::warning::缺少 ${f}，本次 APK 浮层将没有 BGM"; fi
          done
          ls -la assets/magia/

      - name: ☕ 编译 Java 补丁源码 → dex → smali
        run: |
          set -euo pipefail
          CP=".cache/deps/android.jar:.cache/deps/okhttp.jar:.cache/deps/okio.jar"

          # RestClient 只作为编译期桩存在：真实实现在 smali_classes2 里，
          # 不参与本次 dex 产出（下面 d8 的输入里没有它）。
          mkdir -p .build/stubs/io/kamihama/magianative
          cat > .build/stubs/io/kamihama/magianative/RestClient.java <<'STUB'
          package io.kamihama.magianative;
          import android.app.Activity;
          public class RestClient {
              public static Activity getCurrentActivity() { return null; }
              public static void restartApp() {}
          }
          STUB

          mkdir -p .build/classes
          mapfile -t SRC < <(find patch/src/main/java -name '*.java')
          echo "编译 ${#SRC[@]} 个补丁源文件"
          javac -nowarn -source 8 -target 8 -encoding UTF-8 \
                -cp "${CP}" -d .build/classes \
                "${SRC[@]}" .build/stubs/io/kamihama/magianative/RestClient.java

          # ── 分两组出 dex：UI 类进 classes2，其余补丁类进 classes3 ──
          # 这个划分必须与仓库里 smali_classes2/ 和 smali_classes3/ 的现状一致，
          # 否则同一个类会在两个 dex 里各出现一次。
          #
          # ⚠ 第二组用「排除法」而不是逐个点名。原先是点名的，结果 CNBgm 加进来
          # 之后没人记得改这一行，它就**两组都不属于**——编译得出 .class，却进不了
          # 任何 dex。而 CNCNDownloadUI.buildOverlay 里有一句没有兜底的
          # CNBgm.trackCount(act)，真机上会抛 NoClassDefFoundError，浮层直接建不
          # 出来。这种「类静默缺席」的错误静态检查一律看不见，只有装到机器上才炸。
          # 排除法保证以后新加的补丁类默认有归属。
          mkdir -p .build/dexui .build/dex3
          mapfile -t DEX_UI < <(find .build/classes -name 'CNCNDownloadUI*.class' | sort)
          # RestClient 是编译期桩，真实实现在 smali_classes2 里，不能进 dex
          mapfile -t DEX_3 < <(find .build/classes -name '*.class' \
              ! -name 'CNCNDownloadUI*.class' ! -name 'RestClient*.class' | sort)
          echo "classes2 组 ${#DEX_UI[@]} 个类，classes3 组 ${#DEX_3[@]} 个类"
          if [ "${#DEX_UI[@]}" -eq 0 ] || [ "${#DEX_3[@]}" -eq 0 ]; then
            echo "::error::dex 分组为空，补丁类没被编译出来"; exit 1
          fi
          # 每个 .class 都必须恰好落在一组里，否则就是上面那种静默缺席
          TOTAL=$(find .build/classes -name '*.class' ! -name 'RestClient*.class' | wc -l)
          if [ "$(( ${#DEX_UI[@]} + ${#DEX_3[@]} ))" -ne "$TOTAL" ]; then
            echo "::error::dex 分组没覆盖全部补丁类（$TOTAL 个）"; exit 1
          fi
          "${BT_DIR}/d8" --min-api 21 --output .build/dexui --lib .cache/deps/android.jar \
            "${DEX_UI[@]}"
          "${BT_DIR}/d8" --min-api 21 --output .build/dex3 --lib .cache/deps/android.jar \
            "${DEX_3[@]}"

          rm -rf .build/smaliui .build/smali3
          baksmali d .build/dexui/classes.dex -o .build/smaliui
          baksmali d .build/dex3/classes.dex  -o .build/smali3

      - name: 🔁 用编译产物覆盖仓库中的补丁 smali
        run: |
          set -euo pipefail
          # Java 源码是唯一事实来源：每次构建都用它重新生成补丁类的 smali，
          # 这样仓库里的 .smali 即使被手工改过也不会悄悄влия响产物。
          #
          # 注意：smali_classes2/ 里除补丁类以外的内容（含 RestClient 那处
          # 把 cnDownloadFileFull 委托给 CNHotUpdate 的改动）保持原样，
          # 只删掉并重建 CNCNDownloadUI*。
          rm -f smali_classes2/io/kamihama/magianative/CNCNDownloadUI*.smali
          cp .build/smaliui/io/kamihama/magianative/CNCNDownloadUI*.smali \
             smali_classes2/io/kamihama/magianative/

          rm -rf smali_classes3
          mkdir -p smali_classes3
          cp -r .build/smali3/. smali_classes3/

          echo "smali_classes2 补丁类：$(ls smali_classes2/io/kamihama/magianative/CNCNDownloadUI*.smali | wc -l) 个"
          echo "smali_classes3 类：$(find smali_classes3 -name '*.smali' | wc -l) 个"

      - name: 🔨 重组 APK（apktool b）
        run: |
          set -euo pipefail
          apktool b . -o .build/unsigned.apk --use-aapt2
          ls -la .build/unsigned.apk

      - name: 📐 对齐 APK（zipalign）
        run: |
          set -euo pipefail
          "${BT_DIR}/zipalign" -f 4 .build/unsigned.apk .build/aligned.apk
          "${BT_DIR}/zipalign" -c 4 .build/aligned.apk
          echo "对齐校验通过"

      - name: 🔏 签名 APK（AOSP testkey）
        run: |
          set -euo pipefail
          # AOSP 公开测试密钥：与上游发行包同一签名身份，产物可直接覆盖安装。
          # 它是公开的测试密钥，**不提供任何真实性保证**，仅用于保持可覆盖安装。
          mkdir -p .build/key
          for f in testkey.pk8 testkey.x509.pem; do
            curl -sSL -o ".build/key/${f}.b64" \
              "https://android.googlesource.com/platform/build/+/refs/tags/android-13.0.0_r83/target/product/security/${f}?format=TEXT"
            base64 -d ".build/key/${f}.b64" > ".build/key/${f}"
          done
          "${BT_DIR}/apksigner" sign \
            --key .build/key/testkey.pk8 \
            --cert .build/key/testkey.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out .build/legacy-client.apk \
            .build/aligned.apk
          "${BT_DIR}/apksigner" verify --print-certs .build/legacy-client.apk

      - name: 🔍 构建后自检
        run: |
          set -euo pipefail
          APK=.build/legacy-client.apk
          echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
          echo "大小:   $(stat -c%s "$APK") 字节"
          # BGM 的 ogg 必须未压缩，否则 AssetManager.openFd() 打不开，
          # 表现为「界面一切正常、就是没声音」——光看界面发现不了
          python3 tools/check-asset-compression.py "$APK"
          # 每个 .so 的 DT_NEEDED 都要能在包内或系统里解析到，
          # 否则 dlopen 只在真机启动那一刻才失败，静态自检全都发现不了
          python3 tools/check-so-deps.py "$APK"
          # 包里的 .so 与补丁类必须都是这次构建的产物。踩过两次「编译了却没进包」：
          # CNBgm 不在任何一组 d8 输入里；libMagiaLegacy.so 忘了拷进 lib/。
          # 两次都能打包、能签名、能安装，只有真机跑起来才暴露，而且现象会把人
          # 引向去查功能逻辑而不是查产物
          python3 tools/check-apk-freshness.py "$APK"
          # 签名指纹必须是 AOSP testkey，否则装不上既有设备
          FP=$("${BT_DIR}/apksigner" verify --print-certs "$APK" \
                | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          EXPECT="a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc"
          if [ "$FP" != "$EXPECT" ]; then
            echo "::error::签名指纹不符，实得 $FP"
            exit 1
          fi
          echo "签名指纹校验通过（AOSP testkey）"
          # 补丁类必须真的在产物里
          unzip -l "$APK" | grep -qE 'classes3\.dex' \
            || { echo "::error::产物缺少 classes3.dex"; exit 1; }
          echo "自检通过"

      - name: 📤 上传产物
        if: ${{ inputs.verify_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: legacy-client-apk
          path: .build/legacy-client.apk
          retention-days: 30
          compression-level: 0

      - name: 📊 构建报告
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo
            if [ -f .build/legacy-client.apk ]; then
              echo "- 状态：✅ 成功"
              echo "- 客户端版本：\`${CLIENT_VERSION}\`（云端 mirrors.json 的 client.version 抬过它即触发旧包强制更新）"
              echo "- sha256：\`$(sha256sum .build/legacy-client.apk | cut -d' ' -f1)\`"
              echo "- 大小：$(( $(stat -c%s .build/legacy-client.apk) / 1024 / 1024 )) MB"
              echo "- 签名：AOSP testkey（v1+v2+v3）"
            else
              echo "- 状态：❌ 失败"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
