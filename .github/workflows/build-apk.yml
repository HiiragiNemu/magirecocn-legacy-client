name: 🏗️ 构建 APK

# ╔════════════════════════════════════════════════════════════════════╗
# ║   APK 构建                                                          ║
# ╠════════════════════════════════════════════════════════════════════╣
# ║                                                                    ║
# ║ 几点前提                                                            ║
# ║ ────                                                               ║
# ║   ▸ 补丁层里的对外主机名是**构建期注入**的（CNEndpoints，源码里   ║
# ║     恒为空串），所以构建需要 CLIENT_ROOT_DOMAIN /                  ║
# ║     CLIENT_PAGES_HOSTS 等 Secret。缺了会在下面的预检步骤当场失败，  ║
# ║     而不是编出一个「装上去什么都不会发生」的包。                    ║
# ║   ▸ 签名用 **AOSP testkey**，由 CI 从 android.googlesource.com 取，  ║
# ║     不入库、也不需要 keystore Secret。这与 Totentanz 发行的包是同一把 key， ║
# ║     所以产物可以直接覆盖安装。                                       ║
# ║                                                                    ║
# ║ 构建流程                                                            ║
# ║ ───────                                                            ║
# ║   0. 从Totentanz 公开 Release 取整包、经构建链重建出工程树                ║
# ║      （仓库里不存派生文件）                                        ║
# ║   0'. 注入客户端版本号 1.0.<run_number>（强制更新通道的本端版本，     ║
# ║      与 APK 自身 versionName/versionCode 无关）                     ║
# ║   1. 编译 patch/src/main/java/ 下的 Java 补丁源码                   ║
# ║   2. d8 转成 dex 后合入补丁                                        ║
# ║   3. Java 源码是唯一事实来源，编译产物覆盖对应补丁                  ║
# ║   4. 重组 APK                                                      ║
# ║   5. zipalign + apksigner（AOSP testkey）                           ║
# ║   6. 发布 APK：连同版本旁注一起交给发布目标（仅手动触发时）         ║
# ║      —— 版本闸门不在本流水线提升                                    ║
# ║                                                                    ║
# ║ 触发方式：手动（workflow_dispatch），外加 main-checks.yml 以        ║
# ║ workflow_call + verify_only 调进来复验。                            ║
# ║ 不做自动发版——第 6 步只在手动触发且没勾 verify_only 时才跑，        ║
# ║ 一次 push 不会产出新的对外 APK。                                    ║
# ╚════════════════════════════════════════════════════════════════════╝

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: '只构建校验，不发布（不勾＝构建完把 APK 传到发布目标）'
        type: boolean
        default: false
      # 主下载引擎（构建期默认）。engine 选 aria2c 时，CNDownloaderFix 每次先走
      # 进程内 aria2c，失败回退自建引擎；选 self（默认）则 aria2 仍作备用，
      # 仅云端 force_aria2 或调试开关 useAria2 打开时才先用它。
      engine:
        description: '主下载引擎（构建期定死）。self＝自建分块引擎（默认）；aria2c＝进程内 aria2c 为主引擎，失败回退自建'
        type: choice
        options:
          - self
          - aria2c
        default: self
      # 调试悬浮窗是排查工具，不是玩家功能。只有维护者能触发本 workflow
      # （workflow_dispatch 需写权限，fork 还有安全护栏），所以默认按**发布语义**
      # 来：不勾＝对外包无调试悬浮窗；需要内部排查包时才勾上。
      # 总闸烧在 native：不勾时 CMake 传 -DMAGIA_DEBUG_OVERLAY=0，
      # DEBUG_OVERLAY_ENABLED=false，CNDebugOverlay 建不出来。
      debug_overlay:
        description: '是否把调试悬浮窗编进包（native 总闸 MAGIA_DEBUG_OVERLAY；默认关＝发布包不带调试工具）'
        type: boolean
        default: false
  # 供 main-checks.yml 复用（push 到 main 后的复验）。APK 构建本身的
  # **手动触发**属性不变——这里只是允许另一个 workflow 以 verify_only
  # 调进来跑一遍同样的流水线。见 CONTRIBUTING.md「CI 流水线」。
  workflow_call:
    inputs:
      verify_only:
        description: '只构建校验，不发布'
        type: boolean
        default: true
      engine:
        description: '主下载引擎：self / aria2c'
        type: string
        default: self
      debug_overlay:
        description: '是否编译调试悬浮窗（native MAGIA_DEBUG_OVERLAY）'
        type: boolean
        default: false
    # verify-only 调用只声明构建确实需要的四个只读输入。
    secrets:
      BASELINE_APK_URL:
        required: true
      OVERLAY_URL:
        required: true
      CLIENT_ROOT_DOMAIN:
        required: true
      CLIENT_PAGES_HOSTS:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # 工程树不在仓库里：现取Totentanz 整包、经构建链重建出来
      # （见 README「基线与补丁」）。所有写进工程树的步骤都经这个变量，
      # 读工程树的守卫也认它。
      TREE: work/tree

    steps:
      # 防止 fork 出去的副本拿本工作流产出「看起来官方」的包。
      # 判据从「仓库名等于某个写死的值」换成「这份检出是不是 fork」——
      # 想拦的本来就是 fork，直接问这件事既更准，又不必把仓库名写进文件。
      # 仓库改名、迁移、换 owner 时这里都不用动。
      - name: 🛡️ 安全护栏（fork 不得构建）
        if: ${{ github.event.repository.fork }}
        run: |
          echo "::error::这是一个 fork，不允许用本工作流产出对外产物"
          exit 1

      - name: 📦 检出仓库
        uses: actions/checkout@v4

      - name: ☕ 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🔧 安装构建工具
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/local/bin

          # ── 构建工具 2.9.3 ───────────────────────────────────────────
          curl -sSL -o /tmp/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"
          # X-C3：下载即校验 sha256（与 baseline.json 的 apktool pin 同值）——
          # 这个 jar 随后被 sudo 装进 /usr/local/bin 执行；release 资产被替换
          # 或下载链路被劫持时，没有内容校验就是 CI 远程命令执行入口。
          echo "7956eb04194300ce0d0a84ad18771eebc94b89fb8d1ddcce8ea4c056818646f4  /tmp/apktool.jar" \
            | sha256sum -c -
          sudo mv /tmp/apktool.jar /usr/local/bin/apktool.jar
          printf '#!/bin/bash\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' \
            | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool

          # ── 解码器 3.0.9（Google 维护的延续版本，tag 无 v 前缀）──────
          curl -sSL -o /tmp/baksmali.jar \
            "https://github.com/baksmali/smali/releases/download/3.0.9/baksmali-3.0.9-fat-release.jar"
          # X-C3：sha256 钉死（baksmali-3.0.9-fat-release.jar，实测自官方 release）
          echo "1b206070701b2145bd1e6204abd6c14fea877f335486845cd4df149bf5f79c2e  /tmp/baksmali.jar" \
            | sha256sum -c -
          sudo mv /tmp/baksmali.jar /usr/local/bin/baksmali.jar
          printf '#!/bin/bash\nexec java -jar /usr/local/bin/baksmali.jar "$@"\n' \
            | sudo tee /usr/local/bin/baksmali > /dev/null
          sudo chmod +x /usr/local/bin/baksmali

          # ── Android SDK build-tools（d8 / zipalign / apksigner）──────
          BT_DIR="$(ls -d "${ANDROID_HOME}"/build-tools/*/ 2>/dev/null | sort -r | head -1 || true)"
          if [ -z "${BT_DIR}" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null
            BT_DIR="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -r | head -1)"
          fi
          echo "BT_DIR=${BT_DIR%/}" >> "$GITHUB_ENV"
          echo "build-tools: ${BT_DIR}"

          apktool --version
          "${BT_DIR%/}/apksigner" --version

      - name: 📥 准备编译依赖（android.jar + OkHttp）
        run: |
          set -euo pipefail
          # classpath 只有 android.jar + OkHttp/Okio。
          # 补丁源码只用 JDK 自带能力与 Android 框架，不引第三方库。
          mkdir -p .cache/deps
          curl -sSL -o .cache/deps/platform.zip \
            "https://dl.google.com/android/repository/platform-33_r02.zip"
          # X-C3：三个依赖全部 sha256 钉死（platform-33_r02.zip / okhttp /
          # okio，均实测自官方源）——它们进 javac/d8 的 classpath，被污染的
          # jar 会把恶意字节码直接编进补丁 dex。
          echo "f851b13fe89f8510a1250df5e8593e86176b2428f4f3cbe0e304a85818c07bc8  .cache/deps/platform.zip" \
            | sha256sum -c -
          unzip -o -q -j .cache/deps/platform.zip "*/android.jar" -d .cache/deps
          rm -f .cache/deps/platform.zip
          curl -sSL -o .cache/deps/okhttp.jar \
            "https://repo1.maven.org/maven2/com/squareup/okhttp3/okhttp/3.12.13/okhttp-3.12.13.jar"
          echo "508234e024ef7e270ab1a6d5b356f5b98e786511239ca986d684fd1e2cf7bc82  .cache/deps/okhttp.jar" \
            | sha256sum -c -
          curl -sSL -o .cache/deps/okio.jar \
            "https://repo1.maven.org/maven2/com/squareup/okio/okio/1.17.5/okio-1.17.5.jar"
          echo "19a7ff48d86d3cf4497f7f250fbf295f430c13a528dd5b7b203f821802b886ad  .cache/deps/okio.jar" \
            | sha256sum -c -
          ls -la .cache/deps

      # 地址与凭证都搬进 secrets 之后，「没配」与「没传进来」长得一模一样：
      # 两种情况下变量都存在、值都是空串。而后者尤其阴——workflow_call 默认不
      # 继承 secrets，调用方少写一行 `secrets: inherit`，这里就全空，却要等到
      # 十分钟后 fetch 那步才报「没有 BASELINE_APK_URL」，指向完全错误的方向。
      # 所以在动手之前先点名检查，并把那个坑直接写进错误里。
      - name: 🔑 预检必需的 secret
        env:
          BASELINE_APK_URL: ${{ secrets.BASELINE_APK_URL }}
          OVERLAY_URL: ${{ secrets.OVERLAY_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
          CLIENT_ROOT_DOMAIN: ${{ secrets.CLIENT_ROOT_DOMAIN }}
          CLIENT_PAGES_HOSTS: ${{ secrets.CLIENT_PAGES_HOSTS }}
        run: |
          set -euo pipefail
          # CLIENT_ROOT_DOMAIN / CLIENT_PAGES_HOSTS 是**每次**都要的：源码里的
          # 主机名常量恒为空串，缺了照样能编出 APK，但那个包装上去什么都不会
          # 发生（线路表为空、外链全不放行、热更地址拼不出来）。所以在这里拦，
          # 而不是等玩家装上才发现。
          NEED="BASELINE_APK_URL OVERLAY_URL CLIENT_ROOT_DOMAIN CLIENT_PAGES_HOSTS"
          # 发版相关的只有真要发版时才需要。GH_TOKEN 也在这一档：它只服务发版，
          # 构建本身不碰它——取件要凭证的话，凭证跟着 OVERLAY_URL 走。
          if [ "${{ inputs.verify_only }}" != "true" ]; then
            NEED="$NEED GH_TOKEN TARGET_REPO"
          fi
          MISSING=""
          for v in $NEED; do
            if [ -z "${!v:-}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::这些 secret 是空的：$MISSING"
            echo "::error::两种可能——(1) 仓库 Settings 里还没配；(2) 本次是被别的"
            echo "::error::workflow 以 workflow_call 调进来的，而调用方没写 secrets: inherit。"
            echo "::error::第二种最容易误判成「脚本读不到环境变量」：变量其实设了，值是空串。"
            exit 1
          fi
          echo "必需的 secret 都在（$NEED）"
          # Fail before injection if production endpoints are blank or misbound.
          python3 tools/check-production-endpoints.py

      - name: 🚧 校验 native 入口保护（异常绝不外泄）
        run: python3 tools/check-entry-guard.py

      # 调试开关目录（files/madomagi/debug/）是排查工具，不是配置面。它有一条硬
      # 边界：开关只能把客户端退回更接近原包的行为，绝不能关掉任何一道安全判定
      # ——否则谁能写进那个目录，谁就能把防线一条条关掉。这条规矩写在文档里，
      # 但文档挡不住「就加一个方便排查」，所以在这里变成可执行的检查。
      - name: 🔒 校验调试开关没伸进安全判据
        run: python3 tools/check-debug-flag-boundary.py

      # patchset 现在是工程树的**唯一**定义，构建就靠它。这一步是离线自洽检查
      # （毫秒级，不下载 Totentanz 包），排在真去取包之前：清单本身有毛病时越早失败越省事。
      - name: 🧬 校验基线 patchset 自洽
        run: |
          python3 tools/check-baseline.py
          python3 tools/test-check-baseline.py

      # assets/ 与 lib/ 底下绝大多数东西来自原包，但有几个是我们塞进去的自由软件
      # （aria2 是 GPLv2+，带「提供对应源码」的硬义务）。漏声明这种事不会有人发现
      # ——编译过、装机跑得好好的，只有真出事那天才知道少了什么。
      - name: ⚖️ 校验第三方组件声明没有漏项
        run: |
          python3 tools/check-third-party-notices.py
          python3 tools/test-check-third-party-notices.py

      # ── 现取Totentanz 整包，重建出工程树 ───────────────────────────────────────
      # 链条是闭合的，不需要第二棵树来对账：
      #   fetch  基线 APK sha256 + JDK 大版本 + 整棵工程树的指纹
      #   apply  每条 op 的 pre hash（打的是不是我们以为的那份文件）
      #          + post hash（打完是不是我们要的那份）
      # ⚠ 重建必须用 JDK 19+，不能用本 job 的 JDK 17。构建链附的 float 注释
      # 依赖 Float.toString 的格式，JDK 19 换了「最短且能 round-trip」的算法：
      # 同一常量在 17 上是 -8.2930312E7f、在 19+ 上是 -8.293031E7f。整个 APK 里只有
      # 一个文件撞上这一处，注释也不影响 dex——但树就不是同一棵了。
      # 2026-08-14 第一次跑这条腿就栽在这儿：verify 报「内容不同：1」，而那个文件是
      # 与我们毫无关系的 GMS 工具类，现象完全指不向真正的原因。
      # 只在这一步换 JAVA_HOME，别动整个 job 的 JDK（javac / d8 那边按 17 调好的）。
      # Totentanz 整包与构建工具都在公开仓库，不需要凭证。
      - name: 🌱 从Totentanz 整包重建工程树
        env:
          # 图集从哪取：整条 URL 由变量给（逗号分隔可列多条，按序试；需要
          # 凭证时按 https://<user>:<token>@… 写，脚本会拆出来改用请求头发送，
          # 不会进日志）。内容仍按 baseline.json 的 sha256 认——地址错了拿不到，
          # 地址对了内容也还要过 hash，两层各管各的。
          OVERLAY_URL: ${{ secrets.OVERLAY_URL }}
          BASELINE_APK_URL: ${{ secrets.BASELINE_APK_URL }}
        run: |
          set -euo pipefail
          J21="${JAVA_HOME_21_X64:-}"
          if [ -z "$J21" ] || [ ! -x "$J21/bin/java" ]; then
            echo "::error::runner 上找不到 JDK 21（JAVA_HOME_21_X64 未设或不可用）"
            exit 1
          fi
          export JAVA_HOME="$J21"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          python3 tools/baseline.py fetch --java "$J21/bin/java"
          python3 tools/baseline.py apply --out "${TREE}"
          echo "重建树：$(find "${TREE}" -type f | wc -l) 个文件"

      # F-043：正式包（debug_overlay=false）不声明 SYSTEM_ALERT_WINDOW——
      # 调试悬浮窗只在该开关的构建里编译进 native，release 白挂一个强力覆盖层
      # 权限只会扩大未来配置失误的影响面、并让用户无法从 manifest 区分正式/调试
      # 包。debug_overlay=true 的构建保留（浮层靠它）。
      - name: 🚫 正式包剔除悬浮窗权限（F-043）
        if: ${{ inputs.debug_overlay != true }}
        run: |
          set -euo pipefail
          MANIFEST="${TREE}/AndroidManifest.xml"
          sed -i '/android.permission.SYSTEM_ALERT_WINDOW/d' "$MANIFEST"
          if grep -q 'SYSTEM_ALERT_WINDOW' "$MANIFEST"; then
            echo "::error::正式包仍含 SYSTEM_ALERT_WINDOW，剔除失败"
            exit 1
          fi
          echo "已剔除悬浮窗权限（release 构建，debug_overlay=false）"

      # F-051：CNOfflineImportActivity 的 noHistory=true 会让系统文件选择器打开时
      # 把它从返回栈移除、onActivityResult 永远收不到——离线导入在真机直接失效。
      # 所有构建都去掉该属性（与 F-043 一样走 build 后处理，不动 baseline patch）。
      - name: 🛠 移除离线导入跳板的 noHistory（F-051）
        run: |
          set -euo pipefail
          MANIFEST="${TREE}/AndroidManifest.xml"
          sed -i '/CNOfflineImportActivity/s/ android:noHistory="true"//' "$MANIFEST"
          if grep 'CNOfflineImportActivity' "$MANIFEST" | grep -q 'noHistory="true"'; then
            echo "::error::CNOfflineImportActivity 仍含 noHistory，移除失败"
            exit 1
          fi
          echo "已移除 CNOfflineImportActivity 的 noHistory（离线导入结果回调可送达）"

      - name: 🗑 剔除死库：libbacktrace-native / libcrashpad_handler
        run: |
          set -euo pipefail
          # 这两枚 .so 是游戏原版 APK 里 Backtrace.io 崩溃上报 SDK 的 native
          # 组件（f4samurai 自带；上游 Puella-Care 与本项目均未添加，上游
          # 仓库 lib/ 只有 Dobby/cocos/untp，Backtrace.patch 只改游戏自身
          # smali 的上报端点）。1.1.1 → 1.2.0 换基线时已删除全部 358 个埋点
          # SDK 类（含 backtrace Java 侧，见 tools/baseline.py 文档），官方
          # 服务器也已停运——没有任何代码再加载它们，纯死重，且 4K 对齐
          # 无法重链（无源码）。删掉既省体积又根除 16K 对齐扫描噪音。
          #
          # fail-closed：删之前全树搜引用，搜到即失败。将来换基线若重新
          # 引入加载者，这里红灯拦住，而不是静默出一个启动即崩的包。
          if grep -rlsI -e 'backtrace-native' -e 'crashpad' \
               --include='*.smali' --include='*.xml' --include='*.json' \
               --include='*.java' --include='*.cpp' --include='*.h' \
               --include='*.txt' --include='*.yml' \
               "${TREE}"; then
            echo "::error::工程树里仍有 backtrace/crashpad 引用（见上），不能删库——请人工核对引用来源后再放行"
            exit 1
          fi
          for ABI in arm64-v8a armeabi-v7a; do
            rm -f "${TREE}/lib/${ABI}/libbacktrace-native.so" \
                  "${TREE}/lib/${ABI}/libcrashpad_handler.so"
          done
          # 删除必须生效：任何一枚还在就是 rm 没追上基线变化，立即报
          for f in "${TREE}"/lib/*/libbacktrace-native.so "${TREE}"/lib/*/libcrashpad_handler.so; do
            if [ -e "$f" ]; then echo "::error::$f 删除失败"; exit 1; fi
          done
          echo "已剔除 4 枚死库（双 ABI × backtrace-native/crashpad_handler）"

      # 这两道守卫读的是**工程树**里的文件（字体、引擎 web 那几个 smali），
      # 所以必须排在重建之后。原先它们在 last-green.yml 里跑，那边没有树了，
      # 已迁到这里——守卫得待在它要检查的东西旁边。
      - name: 🔤 校验字体基线与重定向目标
        run: python3 tools/check-fonts.py --tree "${TREE}"

      - name: 🕸 核对 WebView 拦截链的假设
        run: python3 tools/check-webview-interceptor.py

      # 代理这条线换过四次路线、停用过三次，而停用的做法是删掉 H() 安装、
      # 留下实现。这一步核对「实现存在」与「真的被安装」是否一致，并要求每个
      # 未安装的实现都写明停用原因——否则谁都分不清哪些还在跑。
      - name: 🔀 核对代理钩子的启用状态与注释一致
        run: python3 tools/check-proxy-hooks.py

      # LbUtility::initLabel 的 cocos2d::Size 虽然在 C++ 源码里按值出现，真实 ABI
      # 却按隐藏指针传递。曾经用同尺寸 POD 代替后被 AArch64 分成 HFA，后续参数
      # 整体错位，只在 MuMu 的 arm64 转译路径稳定暴露为战斗黑屏。
      - name: 🧭 钉住 initLabel 的真实调用 ABI
        run: python3 tools/check-initlabel-abi.py

      # libc++ std::string 固定为三个机器字，但 ARM64 与 ARMv7 的字宽不同。
      # 手写 +8/+16/22 会在 32 位包里读出对象边界；编译器和普通 APK 构建都
      # 发现不了这种可编译的运行时 ABI 错误，所以单独钉住派生布局与双 ABI 合同。
      - name: 🧵 钉住 native string 双 ABI 布局
        run: |
          python3 tools/check-native-string-layout.py
          python3 tools/test-check-native-string-layout.py
          # libarchive「源码修复 ⇄ shipped 二进制」漂移守卫（补丁 19）：源码防护
          # 缺失 FAIL；archive_jni.cpp 仍不在 CMake 编译目标则 WARN「修复未进
          # 二进制」，每构建必现，不许漂移被遗忘。
          python3 tools/check-cnzip-guards.py

      # 前缀规则是译表的显式合同，不是「日文专用」。服务端同一界面
      # 可能下发日文、英文或汉字；字节范围预筛选会让合法规则永远不命中。
      - name: 🧩 校验 engine i18n 前缀规则无字符集门槛
        run: |
          python3 tools/check-engine-i18n-prefix.py
          python3 tools/test-check-engine-i18n-prefix.py

      # JS 热更以临时文件 + 原子换名安装 engine_i18n.tsv。秒级 mtime 会漏掉
      # 同秒替换，且 fopen(旧 inode) 后 stat(新路径) 会把旧内容错绑到新时间戳。
      - name: 🔄 校验 engine i18n 热重载文件身份合同
        run: |
          python3 tools/check-engine-i18n-reload.py
          python3 tools/test-check-engine-i18n-reload.py

      # 兜底线路(DEFAULT_BASE)与规范前缀(CANONICAL_BASE)是两个概念，早先耦合在
      # 同一个常量上。换兜底线路时若把规范前缀一起动了，热更会**静默停摆**——
      # 版本查询每条线路都失败，被当成「已是最新」，没有任何报错。
      - name: 🔗 核对规范前缀与热更地址一致
        run: python3 tools/check-base-urls.py

      # native 的纯语法检查（桩头文件，不需要 NDK）。放在真正编译之前：
      # 打错符号名/少个分号这类错误 5 秒就能查出来，不必等两个 ABI 编译完。
      # ⚠ 通过它不等于 NDK 构建通过——桩的 libc++ 布局与 NDK 不同。
      - name: 📝 native 语法预检（桩头文件）
        run: tools/check-native-syntax.sh

      - name: 🔢 注入客户端版本号（构建号）
        run: |
          set -euo pipefail
          # 客户端版本通道的「本端版本」在这里定：1.0.<run_number>，每个构建
          # 单调递增，可回溯到具体 workflow run。config.json 的 client.version
          # 抬过它，旧包启动时就会弹强制更新框。
          # 注意这与 APK 的 versionName/versionCode 无关——那是 Totentanz 包的身份，
          # 不能动。cpp 里的字面量只是本地构建（build-local.sh）的兜底。
          VER="1.0.${GITHUB_RUN_NUMBER}"
          echo "客户端版本号: ${VER}"
          sed -i -E "s/CLIENT_VERSION = \"[^\"]+\"/CLIENT_VERSION = \"${VER}\"/" \
            magia-native/src/MagiaLegacy.cpp
          grep -q "CLIENT_VERSION = \"${VER}\"" magia-native/src/MagiaLegacy.cpp \
            || { echo "::error::版本号注入失败（CLIENT_VERSION 常量没匹配上）"; exit 1; }
          # 同一版本号也注入 Java 侧统一 UA 常量（CNUserAgent.CLIENT_VERSION），
          # CDN 日志里的 magireco-cn-legacy/<ver> 与强制更新通道的版本一致。
          sed -i -E "s/CLIENT_VERSION = \"[^\"]+\"/CLIENT_VERSION = \"${VER}\"/" \
            patch/src/main/java/io/kamihama/magianative/CNUserAgent.java
          grep -q "CLIENT_VERSION = \"${VER}\"" \
            patch/src/main/java/io/kamihama/magianative/CNUserAgent.java \
            || { echo "::error::版本号注入失败（CNUserAgent.CLIENT_VERSION 常量没匹配上）"; exit 1; }
          echo "CLIENT_VERSION=${VER}" >> "$GITHUB_ENV"

      # 主机名是部署参数：源码里 CNEndpoints 的两个常量恒为空串，取值在这里
      # 从仓库变量写进去。脚本同时做两件构建期必须做的核对：
      #   · 拼出来的规范前缀 sha256 必须等于钉死值——它是写进每台已装设备 15 个
      #     完成标记里的**身份串**，注错一个字符就是全员重下几个 GB；
      #   · 主域同时导出给 native（MAGIA_ROOT_DOMAIN），两侧「自身域不重写」的
      #     判断必须同源，否则会打成死循环或漏判。
      # 只报注入了几项，不 echo 取值——构建日志会长期留存，参数没必要散进去。
      - name: 🌐 注入端点（主域与署名区主机名）
        env:
          CLIENT_ROOT_DOMAIN: ${{ secrets.CLIENT_ROOT_DOMAIN }}
          CLIENT_PAGES_HOSTS: ${{ secrets.CLIENT_PAGES_HOSTS }}
        run: |
          set -euo pipefail
          python3 tools/inject-endpoints.py
          ROOT="$(python3 tools/inject-endpoints.py --print-root)"
          echo "::add-mask::$ROOT"
          echo "MAGIA_ROOT_DOMAIN=$ROOT" >> "$GITHUB_ENV"

      - name: 🛠 编译 libMagiaLegacy.so（magia-native）
        run: |
          set -euo pipefail
          # 取代原先包内两个预编译的 Dobby hook 库：
          #   libuwasa.so   一改：端点重定向（顺带按英文行宽重排剧情文本，正是要去掉的）
          #   libcn_hook.so 二改：拦引擎下载入口接我们的浮层
          NDK_ROOT="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_BASE="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk"
            NDK_ROOT="$(ls -1d $NDK_BASE/* 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            echo "::error::找不到 Android NDK"; exit 1
          fi
          echo "[NDK] 使用 $NDK_ROOT"
          # shadowhook v2.0.1 的 CMakeLists 要求 CMake >= 4.0.2
          # （magia-native/CMakeLists.txt 的 PATCH_COMMAND 已把它降回 3.22；
          # sed 降级补丁的命中由 FetchContent_MakeAvailable 之后的守卫显式
          # 核对，漏命中即 configure 阶段失败），低于降级后要求的 CMake 会
          # 在 configure 阶段直接失败
          cmake --version | head -1

          STRIP="$(find "$NDK_ROOT/toolchains/llvm/prebuilt" -name llvm-strip 2>/dev/null | head -1)"
          for ABI in arm64-v8a armeabi-v7a; do
            BUILD_DIR="magia-native/build/$ABI"
            cmake -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-21 \
              -DCMAKE_BUILD_TYPE=Release \
              -DMAGIA_ROOT_DOMAIN="${MAGIA_ROOT_DOMAIN}" \
              -DMAGIA_DEBUG_OVERLAY=${{ inputs.debug_overlay && 1 || 0 }} \
              -B "$BUILD_DIR" magia-native
            cmake --build "$BUILD_DIR" --parallel
            SO="$BUILD_DIR/libMagiaLegacy.so"
            if [ ! -f "$SO" ]; then echo "::error::[$ABI] 未产出 libMagiaLegacy.so"; exit 1; fi
            cp "$SO" "${TREE}/lib/$ABI/libMagiaLegacy.so"
            [ -n "$STRIP" ] && "$STRIP" --strip-unneeded "${TREE}/lib/$ABI/libMagiaLegacy.so"
            # shadowhook 是**动态库**，libMagiaLegacy 对它有 DT_NEEDED，
            # 必须一并打包——漏了的话 APK 照样能打能签能装，但真机启动时
            # dlopen failed: library "libshadowhook.so" not found。这个坑踩过一次。
            SH="$BUILD_DIR/_deps/shadowhook-build/libshadowhook.so"
            if [ ! -f "$SH" ]; then echo "::error::[$ABI] 未产出 libshadowhook.so"; exit 1; fi
            cp "$SH" "${TREE}/lib/$ABI/libshadowhook.so"
            [ -n "$STRIP" ] && "$STRIP" --strip-unneeded "${TREE}/lib/$ABI/libshadowhook.so"
            echo "[$ABI] MagiaLegacy=$(du -h "${TREE}/lib/$ABI/libMagiaLegacy.so" | cut -f1) shadowhook=$(du -h "${TREE}/lib/$ABI/libshadowhook.so" | cut -f1)"
          done

          # 旧库必须已从包内移除，否则会与新库对同一地址重复装 hook
          for f in "${TREE}"/lib/arm64-v8a/libuwasa.so "${TREE}"/lib/armeabi-v7a/libuwasa.so "${TREE}"/lib/arm64-v8a/libcn_hook.so; do
            if [ -e "$f" ]; then echo "::error::$f 仍然存在，会与 libMagiaLegacy 冲突"; exit 1; fi
          done

      - name: 🎵 转换 BGM：HCA → OGG（vgmstream + ffmpeg）
        env:
          # R4-04：FFmpeg 钉不可变 autobuild，从仓库 Variable 读取官方 digest。
          # vgmstream 可选校验（WARN 不阻断），从仓库 Variable 读取官方 digest。
          FFMPEG_SHA256: ${{ vars.FFMPEG_SHA256 }}
          VGMS_SHA256: ${{ vars.VGMS_SHA256 }}
        run: |
          set -euo pipefail
          # assets 里的 BGM 是 CRI HCA 且 ciphType=56（加密），Android 放不了。
          # vgmstream 自带 CRI 游戏的密钥库，能直接解；再用 ffmpeg 转 OGG。
          mkdir -p .cache/audio

          # R4-04：FFmpeg 是浮动下载（latest 标签可重指）且随后 chmod +x 直接
          # 执行——供应链投毒即 CI RCE。缓解：curl -f 拒绝 HTTP 错误页；FFmpeg
          # 钉**不可变 autobuild**（URL 带时间戳 tag + GitHub Release API 的官方
          # assets[].digest），摘要缺失/不符即硬失败。
          # vgmstream **不钉**（维护者决定 2026-08-19）：只做 HCA 音频解密转换、
          # 内置密钥库不删减、非关键路径；curl -f 已拒绝 HTTP 错误页。
          curl -fsSL -o .cache/audio/vgms.tar.gz \
            "https://github.com/vgmstream/vgmstream-releases/releases/download/nightly/vgmstream-linux-cli.tar.gz"
          # vgmstream 可选 pin（WARN 不阻断）：配了 VGMS_SHA256 就校验（官方
          # Release digest），不符/未配都只告警——音频非关键路径，不该卡构建。
          if [ -n "${VGMS_SHA256:-}" ]; then
            if ! echo "${VGMS_SHA256}  .cache/audio/vgms.tar.gz" | sha256sum -c - >/dev/null 2>&1; then
              echo "::warning::vgmstream 哈希不符（可能上游已更新），请核对该 Variable"
            fi
          else
            echo "::warning::vgmstream 未钉哈希（配置仓库 Variable VGMS_SHA256 可启用校验）"
          fi
          mkdir -p .cache/audio/vgms
          tar xzf .cache/audio/vgms.tar.gz -C .cache/audio/vgms
          VGMS="$(find .cache/audio/vgms -name vgmstream-cli -type f | head -1)"
          chmod +x "${VGMS}"

          # ffmpeg：不走 apt（源不稳），直接拉 BtbN 的静态构建（含 libvorbis）。
          # 钉不可变 autobuild-2026-08-18-15-03 的 ffmpeg-N-126207-g21bbd98e7b，
          # 官方 digest = FFMPEG_SHA256 仓库 Variable。
          : "${FFMPEG_SHA256:?缺少仓库变量 FFMPEG_SHA256；拒绝执行未钉摘要的 FFmpeg}"
          curl -fsSL -o .cache/audio/ff.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-18-15-03/ffmpeg-N-126207-g21bbd98e7b-linux64-gpl.tar.xz"
          echo "${FFMPEG_SHA256}  .cache/audio/ff.tar.xz" | sha256sum -c -
          mkdir -p .cache/audio/ff
          tar xJf .cache/audio/ff.tar.xz -C .cache/audio/ff
          FF="$(find .cache/audio/ff -name ffmpeg -type f | head -1)"
          chmod +x "${FF}"

          python3 tools/convert-bgm.py --vgmstream "${VGMS}" --ffmpeg "${FF}" --tree "${TREE}"

          # 产物必须齐全：缺了浮层就没有 BGM。音频不是关键路径，只告警不阻断。
          for f in "${TREE}"/assets/magia/bgm1.ogg "${TREE}"/assets/magia/bgm2.ogg "${TREE}"/assets/magia/bgm.json; do
            if [ ! -s "${f}" ]; then echo "::warning::缺少 ${f}，本次 APK 浮层将没有 BGM"; fi
          done
          ls -la "${TREE}/assets/magia/"

      # 主下载引擎是构建期默认：CNBuildConfig.MAIN_ENGINE 在源码里恒为 "self"，
      # 取值在这里按「主引擎」选择框写进去（沿用 CLIENT_VERSION / CNEndpoints 的
      # sed 注入模式）。它是编译期常量，javac 会内联引用处，所以必须排在 javac
      # 之前。engine 只定「默认主引擎」，不封死运行时开关——云端 force_aria2 与
      # 调试开关 useAria2 在任何构建里都仍可把 aria2 临时顶上去。
      - name: 🚂 注入主下载引擎（构建期默认）
        run: |
          set -euo pipefail
          ENGINE="${{ inputs.engine }}"
          case "$ENGINE" in
            self|aria2c) ;;
            *) echo "::error::非法引擎值：$ENGINE（只接受 self / aria2c）"; exit 1 ;;
          esac
          sed -i -E "s/MAIN_ENGINE = \"[a-z0-9]+\"/MAIN_ENGINE = \"${ENGINE}\"/" \
            patch/src/main/java/io/kamihama/magianative/CNBuildConfig.java
          grep -q "MAIN_ENGINE = \"${ENGINE}\"" \
            patch/src/main/java/io/kamihama/magianative/CNBuildConfig.java \
            || { echo "::error::引擎注入失败（CNBuildConfig.MAIN_ENGINE 常量没匹配上）"; exit 1; }
          echo "主下载引擎: ${ENGINE}"

      - name: ☕ 编译补丁源码 → dex
        run: |
          set -euo pipefail
          CP=".cache/deps/android.jar:.cache/deps/okhttp.jar:.cache/deps/okio.jar"

          # RestClient 只作为编译期桩存在：真实实现在 smali_classes2 里，
          # 不参与本次 dex 产出（下面 d8 的输入里没有它）。
          mkdir -p .build/stubs/io/kamihama/magianative
          cat > .build/stubs/io/kamihama/magianative/RestClient.java <<'STUB'
          package io.kamihama.magianative;
          import android.app.Activity;
          public class RestClient {
              public static Activity getCurrentActivity() { return null; }
          }
          STUB

          mkdir -p .build/classes
          mapfile -t SRC < <(find patch/src/main/java -name '*.java')
          echo "编译 ${#SRC[@]} 个补丁源文件"
          javac -nowarn -source 8 -target 8 -encoding UTF-8 \
                -cp "${CP}" -d .build/classes \
                "${SRC[@]}" .build/stubs/io/kamihama/magianative/RestClient.java

          # d8 撞上「带 this$0 的类」或「implements Comparator<T>」时，只会报一句
          # R8 内部的 NullPointerException，没有行号也没有别的线索。在这里先拦一道，
          # 把它换成能照着改的话。判据与实测记录见脚本头部。
          python3 tools/check-d8-pitfalls.py .build/classes

          # ── 分两组出 dex：UI 类进 classes2，其余补丁类进 classes3 ──
          # 这个划分必须与仓库里 smali_classes2/ 和 smali_classes3/ 的现状一致，
          # 否则同一个类会在两个 dex 里各出现一次。
          #
          # ⚠ 第二组用「排除法」而不是逐个点名。原先是点名的，结果 CNBgm 加进来
          # 之后没人记得改这一行，它就**两组都不属于**——编译得出 .class，却进不了
          # 任何 dex。而 CNCNDownloadUI.buildOverlay 里有一句没有兜底的
          # CNBgm.trackCount(act)，真机上会抛 NoClassDefFoundError，浮层直接建不
          # 出来。这种「类静默缺席」的错误静态检查一律看不见，只有装到机器上才炸。
          # 排除法保证以后新加的补丁类默认有归属。
          mkdir -p .build/dexui .build/dex3
          mapfile -t DEX_UI < <(find .build/classes -name 'CNCNDownloadUI*.class' | sort)
          # RestClient 是编译期桩，真实实现在 smali_classes2 里，不能进 dex
          mapfile -t DEX_3 < <(find .build/classes -name '*.class' \
              ! -name 'CNCNDownloadUI*.class' ! -name 'RestClient*.class' | sort)
          echo "classes2 组 ${#DEX_UI[@]} 个类，classes3 组 ${#DEX_3[@]} 个类"
          if [ "${#DEX_UI[@]}" -eq 0 ] || [ "${#DEX_3[@]}" -eq 0 ]; then
            echo "::error::dex 分组为空，补丁类没被编译出来"; exit 1
          fi
          # 每个 .class 都必须恰好落在一组里，否则就是上面那种静默缺席
          TOTAL=$(find .build/classes -name '*.class' ! -name 'RestClient*.class' | wc -l)
          if [ "$(( ${#DEX_UI[@]} + ${#DEX_3[@]} ))" -ne "$TOTAL" ]; then
            echo "::error::dex 分组没覆盖全部补丁类（$TOTAL 个）"; exit 1
          fi
          # ⚠ 两组各自出 dex，但 desugar 需要看见**全部**补丁类，所以整个
          # .build/classes 都要作为 --classpath 传进去（--classpath 只供解析类型，
          # 不会被写进输出 dex——这一点实测过：加与不加，两组 dex 逐字节相同）。
          #
          # 不加会怎样：CNCNDownloadUI$17 实现的 CNOfflineImportActivity$Callback
          # 在另一组里，d8 看不见它，于是每次构建都报
          #     Type `...$Callback` was not found, it is required for default or
          #     static interface methods desugaring of `...CNCNDownloadUI$17`
          # 今天这条告警无害——Callback 只有一个抽象方法，没有 default/static，
          # 没东西要 desugar。但 minSdk 21 意味着 default 方法**必须**靠 desugar
          # 才能在 API 21–23 上跑（原生支持是 24+）。哪天有人给某个跨组接口加了
          # default 方法，d8 同样只会报这一句，然后**静默产出装得上、跑起来炸的类**
          # ——而这句话早已天天出现、没人再看。所以：既补上 classpath，也把
          # 「d8 有告警」变成红灯，把这个信号救回来。
          run_d8() {
            local out="$1"; shift
            local log=".build/d8-$(basename "$out").log"
            if ! "${BT_DIR}/d8" --min-api 21 --output "$out" \
                 --lib .cache/deps/android.jar --classpath .build/classes \
                 "$@" > "$log" 2>&1; then
              cat "$log"; echo "::error::d8 失败（$out）"; exit 1
            fi
            cat "$log"
            if grep -qE '^(Warning|Error)' "$log"; then
              echo "::error::d8 出了告警（$out）。desugar 相关的告警在 minSdk 21 上"
              echo "::error::可能意味着产出的类装得上但跑起来炸，不要当噪音略过。"
              exit 1
            fi
          }
          run_d8 .build/dexui "${DEX_UI[@]}"
          run_d8 .build/dex3  "${DEX_3[@]}"

          rm -rf .build/smaliui .build/smali3
          baksmali d .build/dexui/classes.dex -o .build/smaliui
          baksmali d .build/dex3/classes.dex  -o .build/smali3

      - name: 🔁 用编译产物覆盖仓库中的补丁
        run: |
          set -euo pipefail
          # Java 源码是唯一事实来源：每次构建都用它重新生成补丁类的 smali，
          # 这样仓库里的 .smali 即使被手工改过也不会悄悄влия响产物。
          #
          # 注意：smali_classes2/ 里除补丁类以外的内容（含 RestClient 那处
          # 把 cnDownloadFileFull 委托给 CNHotUpdate 的改动）保持原样，
          # 只删掉并重建 CNCNDownloadUI*。
          rm -f "${TREE}"/smali_classes2/io/kamihama/magianative/CNCNDownloadUI*.smali
          cp .build/smaliui/io/kamihama/magianative/CNCNDownloadUI*.smali \
             "${TREE}/smali_classes2/io/kamihama/magianative/"

          rm -rf "${TREE}/smali_classes3"
          mkdir -p "${TREE}/smali_classes3"
          cp -r .build/smali3/. "${TREE}/smali_classes3/"

          echo "smali_classes2 补丁类：$(ls "${TREE}"/smali_classes2/io/kamihama/magianative/CNCNDownloadUI*.smali | wc -l) 个"
          echo "smali_classes3 类：$(find "${TREE}/smali_classes3" -name '*.smali' | wc -l) 个"

      - name: 🔨 重组 APK
        run: |
          set -euo pipefail
          apktool b "${TREE}" -o .build/unsigned.apk --use-aapt2
          ls -la .build/unsigned.apk

      - name: 📐 对齐 APK（zipalign）
        run: |
          set -euo pipefail
          "${BT_DIR}/zipalign" -f 4 .build/unsigned.apk .build/aligned.apk
          "${BT_DIR}/zipalign" -c 4 .build/aligned.apk
          echo "对齐校验通过"

      - name: 🔏 签名 APK（AOSP testkey）
        run: |
          set -euo pipefail
          # AOSP 公开测试密钥：与 Totentanz 发行包同一签名身份，产物可直接覆盖安装。
          # 它是公开的测试密钥，**不提供任何真实性保证**，仅用于保持可覆盖安装。
          #
          # googlesource 在 CI 上间歇性不可达（已撞两次 base64: invalid input），
          # 所以加校验 + 多源回退：首选 googlesource（base64），
          # 回退 GitHub aosp-mirror 的 raw 二进制（走 gh-proxy，不用解码）。
          mkdir -p .build/key
          for f in testkey.pk8 testkey.x509.pem; do
            ok=0
            for attempt in 1 2 3; do
              if curl -sSL --max-time 60 -o ".build/key/${f}.b64" \
                  "https://android.googlesource.com/platform/build/+/refs/tags/android-13.0.0_r83/target/product/security/${f}?format=TEXT" \
                  && base64 -d ".build/key/${f}.b64" > ".build/key/${f}" 2>/dev/null \
                  && [ -s ".build/key/${f}" ]; then
                ok=1; break
              fi
              echo "⚠ googlesource 第 $attempt 次拉取 $f 失败"
              sleep 3
            done
            if [ "$ok" = 0 ]; then
              echo "↪ 回退 gh-proxy + aosp-mirror: $f"
              curl -sSL --max-time 120 -o ".build/key/${f}" \
                "https://gh-proxy.org/https://raw.githubusercontent.com/aosp-mirror/platform_build/refs/tags/android-13.0.0_r83/target/product/security/${f}"
            fi
            # 终检：pk8 是 DER 二进制，pem 必须含 BEGIN CERTIFICATE
            if [ "$f" = "testkey.x509.pem" ]; then
              grep -q "BEGIN CERTIFICATE" ".build/key/${f}" || { echo "::error::$f 内容无效"; exit 1; }
            else
              [ -s ".build/key/${f}" ] || { echo "::error::$f 为空"; exit 1; }
            fi
          done
          "${BT_DIR}/apksigner" sign \
            --key .build/key/testkey.pk8 \
            --cert .build/key/testkey.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out .build/magirecocn-legacy-client.apk \
            .build/aligned.apk
          "${BT_DIR}/apksigner" verify --print-certs .build/magirecocn-legacy-client.apk

      - name: 🔍 构建后自检
        run: |
          set -euo pipefail
          APK=.build/magirecocn-legacy-client.apk
          echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
          echo "大小:   $(stat -c%s "$APK") 字节"
          # BGM 的 ogg 必须未压缩，否则 AssetManager.openFd() 打不开，
          # 表现为「界面一切正常、就是没声音」——光看界面发现不了
          python3 tools/check-asset-compression.py "$APK"
          # 每个 .so 的 DT_NEEDED 都要能在包内或系统里解析到，
          # 否则 dlopen 只在真机启动那一刻才失败，静态自检全都发现不了
          python3 tools/check-so-deps.py "$APK"
          # F-F-07：重链/新编的 arm64 库必须满足 16KB 页对齐（Android 15+ 上
          # 不满足直接 dlopen 失败）。libarchive 预编译违例由脚本内排除并留痕，
          # 其余库（libMagiaLegacy / libaria2c）违例一票否决。
          python3 tools/check-so-alignment.py
          # R4-03：上面无参调用只扫**入库**的 4 枚预编译库；本次新编的
          # libMagiaLegacy/libshadowhook 落在重建树 ${TREE}/lib/arm64-v8a/
          # （见 native 编译 step 的 cp），不进包前的对齐违例必须在这里拦。
          # 注意只逐枚点扫 CI 自建库，**不能**整目录扫：
          # ${TREE} 里还有游戏历史包自带的预编译库（libbacktrace-native /
          # libcrashpad_handler 等），它们不是本工程构建产物、4K 对齐是
          # 既成事实且无法重链，整目录扫会把这些历史库卷进来误报红灯。
          python3 tools/check-so-alignment.py \
            "${TREE}/lib/arm64-v8a/libMagiaLegacy.so" \
            "${TREE}/lib/arm64-v8a/libshadowhook.so"
          # 包里的 .so 与补丁类必须都是这次构建的产物。踩过两次「编译了却没进包」：
          # CNBgm 不在任何一组 d8 输入里；libMagiaLegacy.so 忘了拷进 lib/。
          # 两次都能打包、能签名、能安装，只有真机跑起来才暴露，而且现象会把人
          # 引向去查功能逻辑而不是查产物
          python3 tools/check-apk-freshness.py "$APK"
          python3 tools/check-built-endpoints.py "$APK"
          # 签名指纹必须是 AOSP testkey，否则装不上既有设备
          FP=$("${BT_DIR}/apksigner" verify --print-certs "$APK" \
                | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          EXPECT="a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc"
          if [ "$FP" != "$EXPECT" ]; then
            echo "::error::签名指纹不符，实得 $FP"
            exit 1
          fi
          echo "签名指纹校验通过（AOSP testkey）"
          # minSdk 必须钉在 21：manifest 由 apktool 从基线 APK 重编码，构建链
          # 从不读 uses-sdk。基线 APK 换代时若换成 minSdk≥24 的包，产物会静默
          # 放弃 API 21 设备、CI 照样全绿——只有真机装不上才暴露。这里直接
          # aapt dump badging 断言。
          MIN_SDK=$("${BT_DIR}/aapt" dump badging "$APK" \
                    | awk -F"'" '/^sdkVersion:/{print $2}')
          TARGET_SDK=$("${BT_DIR}/aapt" dump badging "$APK" \
                       | awk -F"'" '/^targetSdkVersion:/{print $2}')
          if [ -z "$MIN_SDK" ]; then
            echo "::error::aapt dump badging 读不到 sdkVersion（APK 可能损坏）"
            exit 1
          fi
          if [ "$MIN_SDK" != "21" ]; then
            echo "::error::产物 minSdkVersion=$MIN_SDK，期望 21——基线换包可能静默抬高了 minSdk，API 21 设备将无法安装"
            exit 1
          fi
          echo "minSdkVersion=$MIN_SDK targetSdkVersion=$TARGET_SDK（符合 minSdk 21 约定）"
          # 登记的高 API 符号出现处必须有 SDK_INT 守卫（见 check-api-levels.py）。
          # javac 对 API 33 编译、d8 的 API model 只覆盖 java.*，android.* 框架
          # 高 API 调用编译期零拦截，这条把铁律 3 从约定变成可执行检查。
          python3 tools/check-api-levels.py
          # 补丁类必须真的在产物里
          unzip -l "$APK" | grep -qE 'classes3\.dex' \
            || { echo "::error::产物缺少 classes3.dex"; exit 1; }
          echo "自检通过"

      # 产物交给发布目标，然后显式 dispatch 通知它——**资产上传本身不产生
      # release 事件**，不 dispatch 那边不会动。
      #
      # 目标是什么、在哪儿，本仓库一律不写：地址只从 secret 取，注释里也不描述。
      # 注意：gh release upload 的 <file>#<name> 语法里 '#' 只改显示标签，
      # 资产真实 name 仍按本地文件名走，所以必须先改名再传——否则拿到的是一个
      # 名字对不上的资产，按名字取件的那一端会直接扑空。
      - name: 🚀 发布 APK
        if: ${{ inputs.verify_only != true }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # 目标地址由仓库变量给，不写死：它随部署走，换目标时不该改代码。
          # 它也不是安全边界——真正的保证来自 token 权限与内容 hash。
          # 缺了就直接失败，别静默发去一个错地方。
          SYNC_REPO: ${{ secrets.TARGET_REPO }}
        run: |
          set -euo pipefail
          SRC=.build/magirecocn-legacy-client.apk
          NAME=magireco-latest-legacy-client.apk
          SIDECAR=magireco-latest-legacy-client.version.json
          if [ -z "${SYNC_REPO:-}" ]; then
            echo "::error::secret TARGET_REPO 未配置（Settings → Secrets and variables → Actions）"
            exit 1
          fi

          # preflight：token 必须能对 UP_REPO 的 release 读写，否则玩家那边留下的
          # 是 404 死链——宁可构建红掉也不发死链。
          #
          # ⚠ 报错必须分清是哪一种。原先三种情况共用一句「GH_TOKEN 缺失或无权限」，
          # 于是 2026-08-13 那次 401（token 本身失效）把维护者送去查权限设置——
          # 而权限一直是对的，过期的是 token。三者的处理办法完全不同：
          #
          #   secret 为空 → 去仓库 Settings 配上
          #   401         → token 已过期/被撤销/粘进了空白，重新签发一枚
          #   403 / 404   → token 有效，但够不着目标（细粒度 PAT 的可访问范围
          #                 是签发它的那个账户，够不到范围外的目标）
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN secret 未配置或为空（Settings → Secrets and variables → Actions）"
            exit 1
          fi

          # 先问 token 自己是谁，顺带把有效期打出来——过期是这条路最常见的
          # 死法，而它到期前一天和到期后一天在配置界面上长得一模一样。
          WHO=$(curl -sS -o /tmp/who.json -D /tmp/who.hdr -w '%{http_code}' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/user || echo 000)
          if [ "$WHO" = "401" ]; then
            echo "::error::GH_TOKEN 无效（HTTP 401 Bad credentials）。这不是权限问题——token 已过期、被撤销，或写进 secret 时混入了换行/空格。请重新签发一枚并更新 secret。"
            exit 1
          fi
          if [ "$WHO" != "200" ]; then
            echo "::error::校验 GH_TOKEN 时 GitHub 返回 HTTP $WHO，无法确认凭据"
            exit 1
          fi
          echo "GH_TOKEN 身份：$(grep -o '"login"[^,]*' /tmp/who.json | head -1)"
          EXP=$(tr -d '\r' < /tmp/who.hdr \
                | grep -i '^github-authentication-token-expiration:' | cut -d' ' -f2- || true)
          # 写成 if 而不是 `[ -n "$EXP" ] && echo ...`。后者在 EXP 为空时整条
          # 返回 1；只要它后面还有别的命令，set -e 并不会中止（实测确认），
          # 但只要哪天它被挪到脚本末尾，这一步就会以 exit 1 收场——一个纯提示
          # 把发布搞挂。if 形式没有这个位置依赖。
          if [ -n "$EXP" ]; then
            echo "::notice::GH_TOKEN 有效期至 ${EXP}（到期后本步骤会以 401 失败）"
          fi

          # 再确认够得着 SYNC_REPO。403 与 404 分开报：无权限时 GitHub 回的可能是
          # 404，不写清楚会让人以为 release 被删了。
          UP=$(curl -sS -o /dev/null -w '%{http_code}' \
               -H "Authorization: Bearer ${GH_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$SYNC_REPO/releases/tags/latest" || echo 000)
          case "$UP" in
            200) echo "$SYNC_REPO latest release 可读，继续发布" ;;
            403) echo "::error::token 有效但无权访问 $SYNC_REPO（HTTP 403）。细粒度 PAT 的可访问范围是签发它的那个账户，够不到范围外的目标；classic PAT 则需要 token 持有者本人对目标有写权限。"; exit 1 ;;
            404) echo "::error::看不到 $SYNC_REPO 的 latest release（HTTP 404）。无权限时同样返回 404，所以这既可能是权限不够，也可能是 latest tag 真的不在了。"; exit 1 ;;
            *)   echo "::error::读取 $SYNC_REPO latest release 返回 HTTP $UP，无法发布"; exit 1 ;;
          esac

          # 版本旁注：闸门那端**只认它**——读到本次版本号后，还要用其中的
          # sha256 与 APK 实际内容对拍，对得上才认。没有它，闸门就只能靠
          # 「构建成功」这种与玩家能不能下到毫无因果关系的信号——那正是
          # 2026-08-20 全体旧版客户端无限更新的成因。
          cp "$SRC" "$NAME"
          SHA=$(sha256sum "$NAME" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$NAME")
          BUILT_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
          APK_NAME="$NAME" APK_SHA="$SHA" APK_SIZE="$SIZE" OUT="$SIDECAR" \
          python3 <<'PY'
          import json, os
          json.dump({
              "version":  os.environ["CLIENT_VERSION"],
              "apk":      os.environ["APK_NAME"],
              "sha256":   os.environ["APK_SHA"],
              "size":     int(os.environ["APK_SIZE"]),
              "built_at": os.environ["BUILT_AT"],
              "run": "%s/%s/actions/runs/%s" % (
                  os.environ.get("GITHUB_SERVER_URL", ""),
                  os.environ.get("GITHUB_REPOSITORY", ""),
                  os.environ.get("GITHUB_RUN_ID", "")),
          }, open(os.environ["OUT"], "w", encoding="utf-8"),
              ensure_ascii=False, indent=2)
          PY
          cat "$SIDECAR"

          # 先包后旁注：中断时宁可留下「包已就位、还没人宣称版本」，
          # 也不要「版本已宣称、包还没上去」——后者会把闸门抬到一个下不到的版本。
          gh release upload latest "$NAME" --repo "$SYNC_REPO" --clobber
          echo "✅ 已上传 $NAME 到 $SYNC_REPO latest Release"
          gh release upload latest "$SIDECAR" --repo "$SYNC_REPO" --clobber
          echo "✅ 已上传 $SIDECAR 到 $SYNC_REPO latest Release"

          # 通知发布目标立即跟进。**这一步失败必须红**：2026-08-21 起这条
          # dispatch 是唯一的自动通知路径，没有「下次常规触发会跟上」这回事了。
          # 没送达 = 产物躺在那儿没人接手，而这正是要根治的那个故障形状。
          #
          # ⚠ event_type 叫 upstream-update 是**历史遗留**，别按字面理解：
          # 这名字来自资产仓还是某个仓库 fork 的年代。2026-08-22 起资产仓已断开
          # 上游、转为组织下的独立私有仓，本条 dispatch 的真实语义是「客户端产物
          # 就绪」，与任何「上游」无关。名字两边都保留不改——它是跨仓库的线上
          # 标识符，一边改一边没改就会静默失联（dispatch 照样返回成功，
          # 那边没人监听）。
          for i in 1 2 3; do
            if gh api "repos/$SYNC_REPO/dispatches" -f event_type=upstream-update; then
              echo "✅ 已通知 $SYNC_REPO 同步"
              exit 0
            fi
            echo "::notice::第 $i 次 dispatch 失败，重试"
            sleep 5
          done
          echo "::error::无法通知发布目标（dispatch 连续失败 3 次）。"
          echo "::error::产物已经传上去了，缺的只是那一声通知——"
          echo "::error::在发布目标那侧手动触发一次即可补上。"
          exit 1

      - name: 📊 构建报告
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo
            if [ -f .build/magirecocn-legacy-client.apk ]; then
              echo "- 状态：✅ 成功"
              echo "- 客户端版本：\`${CLIENT_VERSION}\`（随 APK 一起写进版本旁注；云端闸门不在本流水线提升）"
              echo "- 主下载引擎：\`${{ inputs.engine }}\`"
              echo "- 调试悬浮窗：\`${{ inputs.debug_overlay && '开' || '关' }}\`（native MAGIA_DEBUG_OVERLAY）"
              echo "- sha256：\`$(sha256sum .build/magirecocn-legacy-client.apk | cut -d' ' -f1)\`"
              echo "- 大小：$(( $(stat -c%s .build/magirecocn-legacy-client.apk) / 1024 / 1024 )) MB"
              echo "- 签名：AOSP testkey（v1+v2+v3）"
            else
              echo "- 状态：❌ 失败"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
