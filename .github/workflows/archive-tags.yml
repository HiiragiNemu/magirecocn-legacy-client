name: 🗄️ 备份存档 tag

# ╔════════════════════════════════════════════════════════════════════╗
# ║   删 tag 之前的备份 —— 常备工具，不是一次性的                        ║
# ╠════════════════════════════════════════════════════════════════════╣
# ║                                                                    ║
# ║ 干什么                                                              ║
# ║ ─────                                                              ║
# ║   把 origin 上**当前全部 tag** 打成一个 git bundle，连同可读索引传到 ║
# ║   外部来源的 latest Release，之后顺既有链路镜像出去。地址由仓库      ║
# ║   变量给。                                                          ║
# ║                                                                    ║
# ║   开完分支、`archive/*` 攒够一批要清时再跑一次即可——名单每次现取，  ║
# ║   不写死，所以不需要为下一批改任何东西。                            ║
# ║                                                                    ║
# ║ 为什么放 CI 而不是本地跑                                            ║
# ║ ───────────────────                                                ║
# ║   ▸ 120 MB 从境内机器传到 GitHub 是整条路上最慢最不稳的一段；        ║
# ║     runner 上传 Release 全程在 GitHub 内网。                        ║
# ║   ▸ token 与目标地址都在仓库 Secrets 里，不必落到谁的机器上。        ║
# ║   ▸ 全新克隆没有「本地 tag 过期」的问题——那个坑本地真踩到了两次      ║
# ║     （last-green 每次 push 都被 last-green.yml 移动，而 git fetch    ║
# ║     默认不强制更新已存在的 tag）。                                   ║
# ║                                                                    ║
# ║ 与铁律 6「不做自动发版」的关系                                       ║
# ║ ──────────────────────                                             ║
# ║   仅 workflow_dispatch 手动触发，且产出的不是对外 APK，是一次性的    ║
# ║   归档资产。不自动触发，不建 Release，只往已有的 latest 挂资产。     ║
# ╚════════════════════════════════════════════════════════════════════╝

on:
  workflow_dispatch:
    inputs:
      upload:
        description: '传到发布仓库 Release（关掉则只打包，产物留作 artifact）'
        type: boolean
        default: true
      tarballs:
        description: '额外为每个 tag 打一个 tar.gz（约 1.6 GB，且不含历史）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 防止 fork 出去的副本拿本工作流产出「看起来官方」的包。
      # 判据从「仓库名等于某个写死的值」换成「这份检出是不是 fork」——
      # 想拦的本来就是 fork，直接问这件事既更准，又不必把仓库名写进文件。
      # 仓库改名、迁移、换 owner 时这里都不用动。
      - name: 🛡️ 安全护栏（fork 不得构建）
        if: ${{ github.event.repository.fork }}
        run: |
          echo "::error::这是一个 fork，不允许用本工作流产出对外产物"
          exit 1

      # fetch-depth: 0 是硬要求：要打的是**全部历史**，而且索引里「在 main 上」
      # 那一列要拿 origin/main 比。浅克隆下这列会整列写错而不报错——脚本里
      # require_main() 就是拦这个的。
      - name: 📦 检出仓库（全量历史 + 全部 tag）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🏷 强制同步 tag
        run: |
          set -euo pipefail
          # 即便是全新克隆也显式来一次：last-green 由 last-green.yml 持续 force
          # 移动，checkout 与真正开跑之间也可能又动过。宁可多取一次。
          git fetch --force --prune --tags origin
          echo "本地 tag：$(git tag -l | wc -l) 个"

      - name: 📚 打包（bundle + 索引 + sha256）
        run: |
          set -euo pipefail
          if [ "${{ inputs.tarballs }}" = "true" ]; then
            python3 tools/archive-tags.py pack --tarballs
          else
            python3 tools/archive-tags.py pack
          fi
          ls -lh work/archive/

      # 把索引贴进 run 摘要：备份了什么、每个 tag 是干嘛的，点开这次运行就看得见，
      # 不用先下 120 MB 才知道自己备份了些什么。
      - name: 📋 索引写进运行摘要
        run: |
          set -euo pipefail
          {
            echo "## 备份的 tag"
            echo
            sed -n '/^| tag |/,/^$/p' work/archive/legacy-client-archive-tags-index.md
            echo
            echo "### 产物 sha256"
            echo '```'
            cat work/archive/legacy-client-archive-tags.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🚀 传到发布仓库 Release
        if: ${{ inputs.upload }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        run: python3 tools/archive-tags.py upload

      # 「传上去了」和「传完整了」是两回事：下回来逐个校 sha256。
      # 这一步失败就说明资产是坏的，此时**还没有删任何 tag**，重跑即可。
      - name: 🔍 下回来校验 sha256
        if: ${{ inputs.upload }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        run: python3 tools/archive-tags.py verify

      # 索引与校验和很小，永远留一份在 artifact 里，方便事后查「当时备份了什么」。
      - name: 📤 索引与校验和（artifact）
        uses: actions/upload-artifact@v7
        with:
          name: archive-tags-index
          path: |
            work/archive/*-index.md
            work/archive/*.sha256
          retention-days: 90

      # 没传 Release 时，bundle 只存在于 runner 上，跑完就没了——那就留成 artifact，
      # 否则这次运行等于白跑。
      - name: 📤 bundle（artifact，仅未上传时）
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@v7
        with:
          name: archive-tags-bundle
          path: work/archive/*.bundle
          retention-days: 7
          compression-level: 0

      - name: ✅ 下一步提示
        run: |
          {
            echo
            echo "### 接下来"
            echo
            echo "1. 资产已在目标 \`latest\` Release，等既有链路跑一次即可取走"
            echo "2. 确认镜像到位后再删 tag：\`git push origin --delete refs/tags/<名字>\`"
            echo "3. 本工作流是常备的，下次清 tag 直接再跑一次"
          } >> "$GITHUB_STEP_SUMMARY"
