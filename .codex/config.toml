# Codex CLI 的项目级配置。与 .claude/settings.json 指向同一个脚本，
# 判定逻辑只有一份（tools/agent-guard.py）。
#
# 作用：在任意 Bash 命令执行**之前**把本克隆的 core.hooksPath 指向
# tools/githooks/，于是 CLAUDE.md 的提交约定与 AGENTS.md §0 的分支纪律
# 无需任何手动安装就会生效。详见 tools/agent-guard.py 顶部说明。
#
# 注意：项目级 .codex/ 层需要被信任才会加载（Codex 首次进入仓库时会问）。
# 不信任也不影响正确性——只是退回到手动跑一次 bash tools/install-hooks.sh。

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/tools/agent-guard.py"'
timeout = 15
statusMessage = "核对提交/分支规范"
